name: Weekly Canary (Tier C)

# Tier C — live agent multi-episode canary.
# Runs once a week. Informational only — NEVER blocks release.
# Requires live LLM credentials to be set in GitHub secrets.

on:
  # schedule:
  #   - cron: '0 8 * * 1'  # Monday 08:00 UTC — re-enable when ready
  workflow_dispatch:
    inputs:
      canary_room:
        description: 'Canary room name (domain-realistic, not qa-*)'
        default: 'api-design-review'
      mycelium_ref:
        description: 'Mycelium repo ref. Empty = use release install.'
        default: ''

env:
  LLM_MODEL: ${{ secrets.LLM_MODEL || vars.LLM_MODEL || '' }}
  LLM_API_KEY: ${{ secrets.LLM_API_KEY || vars.LLM_API_KEY || '' }}
  LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || vars.LLM_BASE_URL || '' }}

jobs:
  canary:
    name: Tier C Canary (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true  # Never block anything

    steps:
      - name: Checkout e2e-test repo
        uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.12'

      - name: Install e2e dependencies
        run: uv sync

      - name: Install mycelium CLI
        run: |
          curl -fsSL https://mycelium-io.github.io/mycelium/install.sh | bash
          mycelium --version

      - name: Start mycelium hub
        run: |
          mycelium init --api-url http://localhost:8000 2>/dev/null || true
          mycelium up --detach
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health > /dev/null 2>&1 && echo "Backend healthy" && break
            [ "$i" -eq 60 ] && echo "ERROR: backend not healthy" && exit 1
            sleep 2
          done

      - name: Configure CLI
        run: |
          mycelium config set server.api_url http://localhost:8000 2>/dev/null || true
          {
            [ -n "$LLM_API_KEY" ]  && echo "LLM_API_KEY=$LLM_API_KEY"
            [ -n "$LLM_BASE_URL" ] && echo "LLM_BASE_URL=$LLM_BASE_URL"
            [ -n "$LLM_MODEL" ]    && echo "LLM_MODEL=$LLM_MODEL"
          } > ~/.mycelium/.env || true

      - name: Run canary suite (Tier C — informational only)
        env:
          MYCELIUM_BACKEND_URL: http://localhost:8000
          MYCELIUM_CANARY_ROOM: ${{ github.event.inputs.canary_room || 'api-design-review' }}
        run: |
          echo "=== Canary run — results are INFORMATIONAL only ==="
          echo "Room: $MYCELIUM_CANARY_ROOM"

          mkdir -p artifacts/pyats-runinfo artifacts/pyats-archive
          uv run pyats run job jobs/canary_job.py \
            --datafile data/canary_datafile.yaml \
            --html-logs artifacts \
            --runinfo-dir artifacts/pyats-runinfo \
            --archive-dir artifacts/pyats-archive \
            --no-archive-subdir || echo "Canary run finished (non-zero exit is OK for Tier C)"

      - name: Upload canary results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-results-${{ github.run_id }}
          path: artifacts/
          retention-days: 60

      - name: Tear down
        if: always()
        run: mycelium down 2>/dev/null || true
