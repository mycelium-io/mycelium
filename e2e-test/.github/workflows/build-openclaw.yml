name: Build OpenClaw & Spoke Images

on:
  push:
    branches: [main]
    paths:
      - 'infra/Dockerfile.openclaw'
      - 'infra/Dockerfile.spoke'
      - 'infra/scripts/openclaw-entrypoint.sh'
      - 'infra/scripts/spoke-entrypoint.sh'
  workflow_dispatch:

env:
  HUB_IMAGE: ghcr.io/${{ github.repository_owner }}/mycelium-openclaw
  SPOKE_IMAGE: ghcr.io/${{ github.repository_owner }}/mycelium-spoke

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push hub image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.openclaw
          push: true
          tags: |
            ${{ env.HUB_IMAGE }}:latest
            ${{ env.HUB_IMAGE }}:${{ github.sha }}

      - name: Resolve mycelium CLI version
        id: mycelium-version
        run: |
          VERSION=$(gh api repos/mycelium-io/mycelium/releases/latest --jq .tag_name)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Baking mycelium $VERSION into spoke image"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push spoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.spoke
          target: spoke-release
          push: true
          build-args: |
            MYCELIUM_VERSION=${{ steps.mycelium-version.outputs.version }}
          tags: |
            ${{ env.SPOKE_IMAGE }}:latest
            ${{ env.SPOKE_IMAGE }}:${{ github.sha }}
