name: E2E Tests

# Trigger paths:
# 1. Push to any non-main branch + PRs → Tier A (pr suite, ~10 min)
# 2. Nightly cron 05:00 UTC → Tier A + B (nightly suite, ~30 min)
# 3. Cross-repo dispatch from mycelium repo → pr or nightly
# 4. workflow_dispatch → manual with suite choice
#
# Tier C (canary) is NOT triggered here — it runs from canary_job.py manually
# or via a separate weekly workflow. It never blocks release.

on:
  push:
    branches:
      - '**'
      - '!main'
  pull_request:
    branches: [main]
  schedule:
    # Nightly 05:00 UTC — Tier A + B
    - cron: '0 5 * * *'
  repository_dispatch:
    types:
      - mycelium-pr-test
      - mycelium-nightly
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run'
        type: choice
        default: 'pr'
        options:
          - pr        # Tier A only (~10 min)
          - nightly   # Tier A + B (~30 min)
      mycelium_ref:
        description: 'Mycelium repo ref (branch/tag/SHA). Empty = use release install.'
        default: ''
      datafile:
        description: 'Datafile override (relative to data/)'
        default: ''

env:
  LLM_MODEL: ${{ secrets.LLM_MODEL || vars.LLM_MODEL || '' }}
  LLM_API_KEY: ${{ secrets.LLM_API_KEY || vars.LLM_API_KEY || '' }}
  LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || vars.LLM_BASE_URL || '' }}

jobs:
  e2e:
    name: ${{ format('E2E {0}', github.event.inputs.suite || (github.event.action == 'mycelium-pr-test' && 'pr') || (github.event.action == 'mycelium-nightly' && 'nightly') || (github.event_name == 'schedule' && 'nightly') || 'pr') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON('{"pr":20,"nightly":75}')[github.event.inputs.suite || (github.event.action == 'mycelium-pr-test' && 'pr') || (github.event.action == 'mycelium-nightly' && 'nightly') || (github.event_name == 'schedule' && 'nightly') || 'pr'] || 20 }}

    steps:
      - name: Checkout e2e-test repo
        uses: actions/checkout@v4

      - name: Resolve run parameters
        id: resolve
        env:
          INPUT_SUITE: ${{ github.event.inputs.suite }}
          INPUT_REF: ${{ github.event.inputs.mycelium_ref }}
          INPUT_DATAFILE: ${{ github.event.inputs.datafile }}
          PAYLOAD_SUITE: ${{ github.event.client_payload.suite }}
          PAYLOAD_REF: ${{ github.event.client_payload.mycelium_ref }}
          DISPATCH_ACTION: ${{ github.event.action }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHED: ${{ github.event.schedule }}
        run: |
          if [ -n "$INPUT_SUITE" ]; then
            SUITE="$INPUT_SUITE"
          elif [ -n "$PAYLOAD_SUITE" ]; then
            SUITE="$PAYLOAD_SUITE"
          elif [ "$DISPATCH_ACTION" = "mycelium-pr-test" ]; then
            SUITE="pr"
          elif [ "$DISPATCH_ACTION" = "mycelium-nightly" ]; then
            SUITE="nightly"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            SUITE="nightly"
          else
            SUITE="pr"
          fi

          MYCELIUM_REF="${INPUT_REF:-$PAYLOAD_REF}"

          DATAFILE="$INPUT_DATAFILE"
          if [ -z "$DATAFILE" ]; then
            case "$SUITE" in
              nightly) DATAFILE="nightly_datafile.yaml" ;;
              *)       DATAFILE="pr_datafile.yaml" ;;
            esac
          fi

          echo "suite=$SUITE"             >> "$GITHUB_OUTPUT"
          echo "mycelium_ref=$MYCELIUM_REF" >> "$GITHUB_OUTPUT"
          echo "datafile=$DATAFILE"       >> "$GITHUB_OUTPUT"
          echo "Resolved: suite=$SUITE datafile=$DATAFILE ref=$MYCELIUM_REF"

      - name: Determine build mode
        env:
          REF: ${{ steps.resolve.outputs.mycelium_ref }}
        run: |
          if [ -n "$REF" ]; then
            echo "BUILD_FROM_SOURCE=true" >> "$GITHUB_ENV"
            echo "Building mycelium from source (ref=$REF)"
          else
            echo "BUILD_FROM_SOURCE=false" >> "$GITHUB_ENV"
            echo "Using release install (no mycelium_ref set)"
          fi

      - name: Checkout mycelium repo (source build)
        if: env.BUILD_FROM_SOURCE == 'true'
        uses: actions/checkout@v4
        with:
          repository: mycelium-io/mycelium
          ref: ${{ steps.resolve.outputs.mycelium_ref }}
          path: mycelium-src
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.12'

      - name: Install e2e dependencies
        run: uv sync

      - name: Install mycelium CLI (release)
        if: env.BUILD_FROM_SOURCE != 'true'
        run: |
          curl -fsSL https://mycelium-io.github.io/mycelium/install.sh | bash
          mycelium --version

      - name: Generate mycelium backend client (from committed spec)
        if: env.BUILD_FROM_SOURCE == 'true'
        run: |
          cd mycelium-src
          SPEC_FILE=openapi.json SKIP_FORMAT=1 bash scripts/gen-mycelium-client.sh

      - name: Install mycelium CLI (from source)
        if: env.BUILD_FROM_SOURCE == 'true'
        run: |
          cd mycelium-src/mycelium-cli
          uv tool install -e . --with mycelium-backend-client@../mycelium-client --force
          mycelium --version

      - name: Write compose override for source build
        if: env.BUILD_FROM_SOURCE == 'true'
        run: |
          # Override backend/collector/frontend images to build from checked-out source.
          # mycelium up --build will use this file automatically.
          mkdir -p ~/.mycelium/docker
          cat > ~/.mycelium/docker/compose.override.yml <<'EOF'
          services:
            mycelium-backend:
              build:
                context: ${{ github.workspace }}/mycelium-src/fastapi-backend
                dockerfile: Dockerfile
              image: mycelium-backend:dev
              pull_policy: never
            mycelium-collector:
              build:
                context: ${{ github.workspace }}/mycelium-src/mycelium-cli
                dockerfile: Dockerfile.collector
              image: mycelium-collector:dev
              pull_policy: never
          EOF
          echo "compose.override.yml written for source build"

      - name: Start mycelium hub (SLIM node + backend)
        run: |
          mycelium init --api-url http://localhost:8000 2>/dev/null || true
          # The backend container always creates room/agent dirs as uid 1000
          # (baked into fastapi-backend/Dockerfile), but the GH-hosted runner
          # user is uid 1001. mycelium-cli's write guard
          # (_check_writable_or_bail in mycelium-cli commands/agent.py) rejects
          # writes based on an exact owner-uid match — chmod/setfacl "other"
          # bits don't satisfy that check, only matching ownership does. See
          # the "Start ownership watcher" step below for the actual fix; this
          # is just the initial directory so `mycelium up` has somewhere to
          # write.
          mkdir -p ~/.mycelium/rooms
          chmod -R 777 ~/.mycelium
          if [ "$BUILD_FROM_SOURCE" = "true" ]; then
            mycelium up --build
          else
            mycelium up
          fi
          echo "Waiting for backend..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend healthy"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "ERROR: Backend did not become healthy after 120s"
              mycelium logs 2>&1 | tail -30
              exit 1
            fi
            sleep 2
          done
          # Fix ownership of dirs the backend created during startup.
          sudo chown -R "$USER" ~/.mycelium 2>/dev/null || true
          chmod -R 777 ~/.mycelium || true

      - name: Configure mycelium CLI
        run: |
          mycelium config set server.api_url http://localhost:8000 2>/dev/null || true
          {
            [ -n "$LLM_API_KEY" ]  && echo "LLM_API_KEY=$LLM_API_KEY"
            [ -n "$LLM_BASE_URL" ] && echo "LLM_BASE_URL=$LLM_BASE_URL"
            [ -n "$LLM_MODEL" ]    && echo "LLM_MODEL=$LLM_MODEL"
          } > ~/.mycelium/.env || true
          mycelium doctor 2>&1 || true

      - name: Verify LLM configuration
        run: |
          echo "=== LLM environment check ==="
          [ -n "$LLM_API_KEY" ]  && echo "LLM_API_KEY:  set" || echo "LLM_API_KEY:  NOT SET (LLM tests will skip)"
          [ -n "$LLM_BASE_URL" ] && echo "LLM_BASE_URL: set" || echo "LLM_BASE_URL: NOT SET"
          [ -n "$LLM_MODEL" ]    && echo "LLM_MODEL:    $LLM_MODEL" || echo "LLM_MODEL:    NOT SET"

      - name: Start spoke containers (nightly only)
        if: steps.resolve.outputs.suite == 'nightly'
        run: |
          MYCELIUM_BACKEND_URL=http://host.docker.internal:8000 \
            docker compose -f infra/compose.spokes.yaml up -d
          echo "Waiting for spokes to install CLI..."
          for container in e2e-spoke1 e2e-spoke2; do
            for i in $(seq 1 30); do
              if docker exec "$container" mycelium --version >/dev/null 2>&1; then
                echo "  $container ready"
                break
              fi
              [ "$i" -eq 30 ] && echo "  WARNING: $container CLI not ready" || sleep 5
            done
          done

      - name: Clean artifacts dir
        run: rm -rf artifacts

      - name: Start ownership watcher
        run: |
          # Rooms are created continuously throughout the ~30min test run, each
          # owned by the backend container's uid (1000) the moment it's
          # created. The one-time chown in the previous step only covers dirs
          # that exist before tests start, and mycelium-cli's write guard
          # checks live ownership, not permission bits — so keep re-chowning
          # in the background for the life of the test run.
          ( while true; do
              sudo chown -R "$USER" ~/.mycelium/rooms 2>/dev/null
              sleep 3
            done ) &
          echo $! > /tmp/mycelium-chown-watcher.pid

      - name: Run E2E tests
        env:
          MYCELIUM_BACKEND_URL: http://localhost:8000
          MYCELIUM_E2E_RUNTIME: local
          SUITE: ${{ steps.resolve.outputs.suite }}
          MYCELIUM_DATAFILE: ${{ steps.resolve.outputs.datafile }}
        run: |
          case "$SUITE" in
            nightly)
              JOB_FILE="jobs/nightly_job.py"
              # Use compose testbed for nightly so hub-spoke tests run via docker exec
              TESTBED="testbeds/compose.yaml"
              ;;
            *)
              JOB_FILE="jobs/pr_job.py"
              TESTBED="testbeds/local.yaml"
              ;;
          esac

          echo "Suite:    $SUITE"
          echo "Job:      $JOB_FILE"
          echo "Testbed:  $TESTBED"
          echo "Datafile: $MYCELIUM_DATAFILE"

          mkdir -p artifacts/pyats-runinfo artifacts/pyats-archive

          uv run pyats run job "$JOB_FILE" \
            --testbed-file "$TESTBED" \
            --html-logs artifacts \
            --runinfo-dir artifacts/pyats-runinfo \
            --archive-dir artifacts/pyats-archive \
            --no-archive-subdir

      - name: Stop ownership watcher
        if: always()
        run: kill "$(cat /tmp/mycelium-chown-watcher.pid)" 2>/dev/null || true

      - name: Print results summary
        if: always()
        run: |
          echo "=== pyATS Results ==="
          RUNINFO=$(ls -td artifacts/pyats-runinfo/*/ 2>/dev/null | head -1)
          if [ -n "$RUNINFO" ]; then
            for logfile in "$RUNINFO"/TaskLog.rst "$RUNINFO"/TaskLog; do
              [ -f "$logfile" ] && cat "$logfile" && break
            done
          fi

      - name: Collect service logs
        if: always()
        run: |
          mkdir -p artifacts/logs
          mycelium logs > artifacts/logs/mycelium.log 2>&1 || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ github.run_id }}
          path: artifacts/
          retention-days: 30

      - name: Tear down spokes
        if: always()
        run: docker compose -f infra/compose.spokes.yaml down 2>/dev/null || true

      - name: Tear down hub
        if: always()
        run: mycelium down 2>/dev/null || true
