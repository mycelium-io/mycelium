# E2E CI Docker Compose stack for Mycelium.
#
# Self-contained stack for running the full pyATS E2E suite:
#   mycelium-db → CFN services → mycelium-backend → matrix-synapse
#
# Usage:
#   docker compose -f infra/compose.e2e.yaml up -d
#   docker compose -f infra/compose.e2e.yaml run --rm matrix-bootstrap
#   docker compose -f infra/compose.e2e.yaml run --rm mycelium-bootstrap
#
# All services use a shared network (mycelium-e2e) and are accessible from
# the host on their mapped ports. The pyATS runner runs on the host.

x-common-env: &common-env
  MYCELIUM_DB_PASSWORD: ${MYCELIUM_DB_PASSWORD:-password}

services:

  # ── Database ──────────────────────────────────────────────────────────
  mycelium-db:
    image: ghcr.io/mycelium-io/mycelium-db:${MYCELIUM_IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: e2e-mycelium-db
    command: postgres -c max_locks_per_transaction=256 -c shared_preload_libraries=timescaledb -c max_connections=300
    environment:
      <<: *common-env
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MYCELIUM_DB_PASSWORD:-password}
      POSTGRES_DB: mycelium
    ports:
      - "${E2E_DB_PORT:-5432}:5432"
    volumes:
      - e2e-db-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mycelium"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    networks:
      - mycelium-e2e

  # ── CFN Management Plane ──────────────────────────────────────────────
  ioc-cfn-mgmt-plane-svc:
    image: ${CFN_MGMT_IMAGE:-ghcr.io/outshift-open/ioc-cfn-mgmt-plane-svc:2026-06-26-d2e97e4}
    container_name: e2e-cfn-mgmt
    depends_on:
      mycelium-db:
        condition: service_healthy
    environment:
      <<: *common-env
      SERVICE_NAME: ioc-cfn-mgmt-plane-svc
      APPLICATION_VERSION: latest
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ADMIN_USER_PASSWORD: ${ADMIN_USER_PASSWORD:-admin}
      POSTGRES_HOST: mycelium-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: cfn_mgmt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MYCELIUM_DB_PASSWORD:-password}
      PORT: 9000
      CFN_DEV_MODE: ${CFN_DEV_MODE:-true}
      CFN_NAME: ${CFN_NAME:-mycelium-cfn}
      CFN_SVC_URL: ${CFN_SVC_URL:-http://ioc-cfn-svc:9002}
    ports:
      - "${E2E_CFN_MGMT_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/internal/diagnostics/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      - mycelium-e2e

  # ── CFN Knowledge Memory ──────────────────────────────────────────────
  ioc-knowledge-memory-svc:
    image: ${CFN_KNOWLEDGE_IMAGE:-ghcr.io/outshift-open/ioc-knowledge-memory-svc:2026-06-26-ee8f699}
    platform: linux/amd64
    container_name: e2e-knowledge-memory
    depends_on:
      mycelium-db:
        condition: service_healthy
      ioc-cfn-mgmt-plane-svc:
        condition: service_healthy
    environment:
      SERVICE_NAME: ioc-knowledge-memory-svc
      APPLICATION_VERSION: latest
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MEMORY_PROVIDER_REGISTRATION_URL: http://ioc-cfn-mgmt-plane-svc:9000
      MEMORY_PROVIDER_ID: ${MEMORY_PROVIDER_ID:-de54dacb-60ab-476a-9e83-64e09f867358}
      IOC_KNOWLEDGE_DB_HOST: mycelium-db
      IOC_KNOWLEDGE_DB: ${IOC_KNOWLEDGE_DB:-ioc-graph-db}
      IOC_KNOWLEDGE_DB_USER: postgres
      IOC_KNOWLEDGE_DB_PASSWORD: ${MYCELIUM_DB_PASSWORD:-password}
      IOC_KNOWLEDGE_DB_PORT: 5432
      EMBEDDING_VECTOR_SIZE: ${EMBEDDING_VECTOR_SIZE:-384}
    ports:
      - "${E2E_KNOWLEDGE_PORT:-9003}:9003"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9003/api/internal/diagnostics/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      - mycelium-e2e

  # ── CFN Fabric Node ───────────────────────────────────────────────────
  ioc-cfn-svc:
    image: ${CFN_NODE_IMAGE:-ghcr.io/outshift-open/ioc-cfn-svc:2026-06-26-dd16901}
    platform: linux/amd64
    container_name: e2e-cfn-node
    depends_on:
      mycelium-db:
        condition: service_healthy
      ioc-cfn-mgmt-plane-svc:
        condition: service_healthy
      ioc-knowledge-memory-svc:
        condition: service_healthy
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: ioc-cfn-svc
      MGMT_URL: http://ioc-cfn-mgmt-plane-svc:9000
      CFN_NAME: ${CFN_NAME:-mycelium-cfn}
      DB_HOST: mycelium-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cfn_cp}
      DB_USER: postgres
      DB_PASSWORD: ${MYCELIUM_DB_PASSWORD:-password}
      DB_SSL_MODE: disable
      PORT: 9002
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-10}
      KNOWLEDGE_MEMORY_SVC_URL: http://ioc-knowledge-memory-svc:9003
      COGNITION_ENGINE_SVC_URL: http://ioc-cfn-cognition-engine:9004
      MEMORY_CLIENT_TIMEOUT_SECONDS: ${MEMORY_CLIENT_TIMEOUT_SECONDS:-90}
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
    ports:
      - "${E2E_CFN_NODE_PORT:-9002}:9002"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9002/api/internal/diagnostics/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      - mycelium-e2e

  # ── CFN Cognition Engine ──────────────────────────────────────────────
  ioc-cfn-cognition-engine:
    image: ${CFN_CE_IMAGE:-ghcr.io/outshift-open/ioc-cfn-cognition-engines:2026-06-26-c01c60a}
    platform: linux/amd64
    container_name: e2e-cfn-cognition-engine
    depends_on:
      ioc-cfn-mgmt-plane-svc:
        condition: service_healthy
      ioc-cfn-svc:
        condition: service_healthy
    environment:
      ENABLE_DEDUP: "true"
      CFN_URL: http://ioc-cfn-svc:9002
      COGNITION_ENGINE_HOST: ioc-cfn-cognition-engine
      COGNITION_ENGINE_PORT: 9004
      RETRY_MAX_ATTEMPTS: ${CFN_RETRY_MAX_ATTEMPTS:-1}
      VALIDATION_SCORE_INTERVENTION: ${CFN_VALIDATION_SCORE_INTERVENTION:-0.6}
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
    ports:
      - "${E2E_CFN_CE_PORT:-9004}:9004"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9004/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      - mycelium-e2e

  # ── Mycelium Backend ──────────────────────────────────────────────────
  #
  # The published image runs as UID 1000 (mycelium). Named volumes are
  # root-owned on first creation, so start as root, fix perms, then exec
  # the normal start.sh as mycelium.
  mycelium-backend:
    image: ${MYCELIUM_BACKEND_IMAGE:-ghcr.io/mycelium-io/mycelium-backend:${MYCELIUM_IMAGE_TAG:-latest}}
    container_name: e2e-mycelium-backend
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /home/mycelium/.mycelium
        chown -R 1000:0 /home/mycelium/.mycelium
        exec runuser -u mycelium -- sh -c "cd /app && ./start.sh"
    depends_on:
      mycelium-db:
        condition: service_healthy
      ioc-cfn-mgmt-plane-svc:
        condition: service_healthy
      ioc-cfn-svc:
        condition: service_healthy
      ioc-cfn-cognition-engine:
        condition: service_healthy
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://postgres:${MYCELIUM_DB_PASSWORD:-password}@mycelium-db:5432/mycelium"
      GRAPH_DB_URL: "postgresql://postgres:${MYCELIUM_DB_PASSWORD:-password}@mycelium-db:5432/mycelium"
      API_BASE_URL: http://mycelium-backend:8000
      CFN_MGMT_URL: http://ioc-cfn-mgmt-plane-svc:9000
      CFN_SVC_URL: http://ioc-cfn-svc:9002
      COORDINATION_TICK_TIMEOUT_SECONDS: ${COORDINATION_TICK_TIMEOUT_SECONDS:-30}
      MYCELIUM_DATA_DIR: /home/mycelium/.mycelium
      MYCELIUM_STUB_EMBEDDINGS: "${MYCELIUM_STUB_EMBEDDINGS:-0}"
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      WORKSPACE_ID: "${WORKSPACE_ID:-}"
      MAS_ID: "${MAS_ID:-}"
    ports:
      - "${E2E_BACKEND_PORT:-8000}:8000"
    volumes:
      - e2e-mycelium-data:/home/mycelium/.mycelium
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - mycelium-e2e

  # ── Matrix Synapse ────────────────────────────────────────────────────
  #
  # The official Synapse image runs as UID 991 (synapse). The named volume
  # is owned by root on first creation, so we start as root, fix perms,
  # copy config, generate the signing key, then exec as the synapse user.
  matrix-synapse:
    image: matrixdotorg/synapse:latest
    container_name: e2e-matrix-synapse
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - |
        chown -R 991:991 /data
        cp /conf/homeserver.yaml /data/homeserver.yaml
        cp /conf/log.config /data/log.config
        exec gosu 991:991 python -m synapse.app.homeserver --config-path /data/homeserver.yaml
    environment:
      SYNAPSE_SERVER_NAME: local
      SYNAPSE_REPORT_STATS: "no"
    volumes:
      - e2e-synapse-data:/data
      - ./synapse/homeserver.yaml:/conf/homeserver.yaml:ro
      - ./synapse/log.config:/conf/log.config:ro
    ports:
      - "${E2E_MATRIX_PORT:-8008}:8008"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8008/_matrix/client/versions')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks:
      - mycelium-e2e

  # ── Bootstrap: Matrix accounts + room ─────────────────────────────────
  matrix-bootstrap:
    image: python:3.12-slim
    container_name: e2e-matrix-bootstrap
    depends_on:
      matrix-synapse:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
      - e2e-shared:/shared
    environment:
      MATRIX_HOMESERVER: http://matrix-synapse:8008
      MATRIX_SHARED_SECRET: e2e-shared-secret
    entrypoint: ["python3", "/scripts/bootstrap-matrix.py"]
    networks:
      - mycelium-e2e
    profiles:
      - bootstrap

  # ── Bootstrap: Mycelium workspace ─────────────────────────────────────
  mycelium-bootstrap:
    image: python:3.12-slim
    container_name: e2e-mycelium-bootstrap
    depends_on:
      mycelium-backend:
        condition: service_healthy
      ioc-cfn-mgmt-plane-svc:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
      - e2e-shared:/shared
    environment:
      BACKEND_URL: http://mycelium-backend:8000
      CFN_MGMT_URL: http://ioc-cfn-mgmt-plane-svc:9000
    entrypoint: ["python3", "/scripts/bootstrap-mycelium.py"]
    networks:
      - mycelium-e2e
    profiles:
      - bootstrap

  # ── Metrics Collector (Hub) ─────────────────────────────────────────
  #
  # OTLP receiver + backend poller.  Spokes forward their OTLP payloads
  # here so the hub has a unified cross-host view.
  # Start with: docker compose -f infra/compose.e2e.yaml up -d mycelium-collector
  mycelium-collector:
    image: ${MYCELIUM_COLLECTOR_IMAGE:-ghcr.io/mycelium-io/mycelium-collector:${MYCELIUM_IMAGE_TAG:-latest}}
    container_name: e2e-mycelium-collector
    depends_on:
      mycelium-backend:
        condition: service_healthy
    command:
      - "--port=4318"
      - "--output=/home/collector/.mycelium/metrics/metrics.json"
      - "--backend-url=http://mycelium-backend:8000"
    ports:
      - "${E2E_COLLECTOR_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4318/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - mycelium-e2e

  # ── Mycelium Hub (unified spoke image + HUB_ADAPTERS) ────────────────
  #
  # Uses the same ``mycelium-spoke`` image and ``spoke-entrypoint.sh`` as
  # the spokes so hub can run openclaw / cursor / hermes side-by-side with
  # a baked-in mycelium CLI. ``OPENCLAW_ROLE=hub`` selects alpha/beta/
  # gamma/delta; ``HUB_ADAPTERS`` gates which adapter runtimes start.
  #
  # Service + container names remain ``openclaw-hub`` / ``e2e-openclaw-hub``
  # for backwards-compat with pyATS testbeds and the GitHub Actions workflow.
  openclaw-hub:
    image: ${MYCELIUM_SPOKE_IMAGE:-ghcr.io/mycelium-io/mycelium-spoke:latest}
    container_name: e2e-openclaw-hub
    depends_on:
      mycelium-backend:
        condition: service_healthy
      matrix-synapse:
        condition: service_healthy
      mycelium-collector:
        condition: service_healthy
    environment:
      OPENCLAW_ROLE: hub
      SPOKE_ADAPTERS: "${HUB_ADAPTERS:-openclaw,cursor}"
      MATRIX_HOMESERVER: http://matrix-synapse:8008
      MYCELIUM_BACKEND_URL: http://mycelium-backend:8000
      COLLECTOR_HUB_URL: http://mycelium-collector:4318
      MATRIX_SHARED_SECRET: e2e-shared-secret
      TOKEN_FILE: /shared/matrix-tokens.json
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      CURSOR_API_KEY: "${CURSOR_API_KEY:-}"
      CURSOR_MODEL: "${CURSOR_MODEL:-claude-4.5-haiku}"
    volumes:
      - e2e-shared:/shared:ro
      - ${HOST_CURSOR_AUTH:-/dev/null}:/run/host-secrets/cursor-auth.json:ro
    ports:
      - "${E2E_OPENCLAW_PORT:-18789}:18789"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:18789/health 2>/dev/null || pgrep -f 'openclaw' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - mycelium-e2e

  # ── OpenClaw Spoke 1 (unified: openclaw + cursor + hermes) ──────────
  #
  # Single "device" container that can stand in for any adapter combo.
  # ``SPOKE_ADAPTERS`` (default "openclaw") gates which runtimes start;
  # set it to ``openclaw,cursor,hermes`` for the full matrix.
  #
  # The cursor auth bind-mount is best-effort: when ``HOST_CURSOR_AUTH``
  # is unset it falls back to ``/dev/null``, which docker tolerates as
  # an empty read-only file (cursor-agent then logs a clear "not
  # authenticated" message rather than crashing the container).
  #
  # Service + container names retain the ``openclaw-spoke{1,2}`` /
  # ``e2e-openclaw-spoke{1,2}`` form so the existing GitHub Actions
  # workflow and pyATS testbeds keep working without a co-ordinated
  # rename.
  #
  # Start AFTER bootstraps and the collector:
  #   docker compose -f infra/compose.e2e.yaml up -d openclaw-spoke1 openclaw-spoke2
  openclaw-spoke1:
    image: ${MYCELIUM_SPOKE_IMAGE:-ghcr.io/mycelium-io/mycelium-spoke:latest}
    container_name: e2e-openclaw-spoke1
    depends_on:
      mycelium-backend:
        condition: service_healthy
      matrix-synapse:
        condition: service_healthy
      mycelium-collector:
        condition: service_healthy
    environment:
      OPENCLAW_ROLE: spoke1
      SPOKE_ADAPTERS: "${SPOKE_ADAPTERS:-openclaw}"
      MATRIX_HOMESERVER: http://matrix-synapse:8008
      MYCELIUM_BACKEND_URL: http://mycelium-backend:8000
      COLLECTOR_HUB_URL: http://mycelium-collector:4318
      MATRIX_SHARED_SECRET: e2e-shared-secret
      TOKEN_FILE: /shared/matrix-tokens.json
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      CURSOR_API_KEY: "${CURSOR_API_KEY:-}"
      CURSOR_MODEL: "${CURSOR_MODEL:-claude-4.5-haiku}"
    volumes:
      - e2e-shared:/shared:ro
      # Host cursor auth (optional; left as an explicit empty default
      # so compose doesn't choke when the file is absent).
      - ${HOST_CURSOR_AUTH:-/dev/null}:/run/host-secrets/cursor-auth.json:ro
    ports:
      - "${E2E_SPOKE1_PORT:-18790}:18789"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:18789/health 2>/dev/null || pgrep -f 'openclaw' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - mycelium-e2e

  # ── OpenClaw Spoke 2 ────────────────────────────────────────────────
  openclaw-spoke2:
    image: ${MYCELIUM_SPOKE_IMAGE:-ghcr.io/mycelium-io/mycelium-spoke:latest}
    container_name: e2e-openclaw-spoke2
    depends_on:
      mycelium-backend:
        condition: service_healthy
      matrix-synapse:
        condition: service_healthy
      mycelium-collector:
        condition: service_healthy
    environment:
      OPENCLAW_ROLE: spoke2
      SPOKE_ADAPTERS: "${SPOKE_ADAPTERS:-openclaw}"
      MATRIX_HOMESERVER: http://matrix-synapse:8008
      MYCELIUM_BACKEND_URL: http://mycelium-backend:8000
      COLLECTOR_HUB_URL: http://mycelium-collector:4318
      MATRIX_SHARED_SECRET: e2e-shared-secret
      TOKEN_FILE: /shared/matrix-tokens.json
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      CURSOR_API_KEY: "${CURSOR_API_KEY:-}"
      CURSOR_MODEL: "${CURSOR_MODEL:-claude-4.5-haiku}"
    volumes:
      - e2e-shared:/shared:ro
      - ${HOST_CURSOR_AUTH:-/dev/null}:/run/host-secrets/cursor-auth.json:ro
    ports:
      - "${E2E_SPOKE2_PORT:-18791}:18789"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:18789/health 2>/dev/null || pgrep -f 'openclaw' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - mycelium-e2e

  # ── pyATS Runner ──────────────────────────────────────────────────────
  #
  # Runs easypy jobs inside Linux (avoids macOS fork-safety crashes).
  # Not started by `docker compose up -d`; invoke explicitly:
  #   docker compose -f infra/compose.e2e.yaml run --rm pyats-runner \
  #       pyats run job jobs/integration_job.py
  pyats-runner:
    build:
      context: ..
      dockerfile: infra/Dockerfile.pyats
    container_name: e2e-pyats-runner
    working_dir: /tests
    environment:
      MYCELIUM_BACKEND_URL: http://mycelium-backend:8000
      CFN_MGMT_URL: http://ioc-cfn-mgmt-plane-svc:9000
      CFN_SVC_URL: http://ioc-cfn-svc:9002
      MATRIX_URL: http://matrix-synapse:8008
    volumes:
      - ../artifacts:/tests/artifacts
    networks:
      - mycelium-e2e
    profiles:
      - runner

volumes:
  e2e-db-data:
  e2e-synapse-data:
  e2e-mycelium-data:
  e2e-shared:

networks:
  mycelium-e2e:
    name: mycelium-e2e
