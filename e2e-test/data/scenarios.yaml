# Three-axis E2E scenario matrix.
#
# Each row generates exactly one pyATS Testcase class at import time via
# ``testcases.scenarios.make_scenarios``. Class names are deterministic
# so the same row always maps to the same artifact name in reports.
#
# Axes:
#   tier:      pr | nightly | weekly  (filters via MYCELIUM_E2E_TIERS env)
#   category:  core | distributed | cross_channel  (legacy pyATS groups)
#   agents:    list of {handle, adapter, host}     (the per-row combo)
#
# Hosts are logical names resolved against the active testbed:
#   hub     → openclaw-hub container / oclw4 lab box
#   spoke1  → openclaw-spoke1       / oclw3
#   spoke2  → openclaw-spoke2       / oclw5
#
# Adapters and their flow differences (baked into the provisioners,
# not the scenario rows):
#   openclaw  pre-installed in gateway; wake = Matrix DM
#   cursor    cold-spawn per tick; wake = `mycelium agent invoke`; slow
#   hermes    plugin polls sessions; wake = no-op
#
# When adding rows, prefer reusing an existing ``base_name`` so the
# matrix grows by combo, not by topic — e.g. a new he-he row reuses
# ``base_name: TwoAgentConsensus`` and produces
# ``TwoAgentConsensus_he_he``.

scenarios:
  # ────────────────────────────────────────────────────────────────────
  #  Tier: PR  (30-minute budget, broad-coverage canaries)
  # ────────────────────────────────────────────────────────────────────

  # The PR canary: openclaw is the fastest adapter and we want to
  # exercise consensus + plan + memory + search in a single short row
  # so we get the maximum signal per minute of wall-clock budget.
  - name: two-agent-consensus-broad-oc-oc
    base_name: TwoAgentConsensusBroad
    tier: pr
    category: core
    description: >
      PR canary — openclaw vs openclaw on the hub with a full
      consensus → plan → memory → search check. Tightest happy path.
    topic: api-style
    agents:
      - handle: alpha
        adapter: openclaw
        host: hub
        position: >
          I want REST with OpenAPI; GraphQL is fine for internal tools
          only. Hard limit: no public-facing GraphQL without persisted
          queries.
      - handle: beta
        adapter: openclaw
        host: hub
        position: >
          GraphQL for the developer platform — over-fetching is killing
          us. Compromise: REST acceptable for uploads/webhooks.
    require_consensus: true
    require_plan_file: true
    memory_writes:
      - handle: alpha
        key: decisions/api-style
        value: '{"choice":"see consensus","author":"alpha"}'
      - handle: beta
        key: status/integration
        value: "frontend ready to migrate within 4 weeks"
    search_queries:
      - query: what was decided about the API design
        expected_substring: api-style

  # A second PR row to ensure cross-family openclaw/cursor coordination
  # at least starts a session end-to-end. We don't require consensus —
  # if cursor cold-start eats the budget on a busy runner we still
  # collect the value of "did the wake protocols agree?". Failure here
  # means the autonomous loop is broken upstream of CFN.
  - name: two-agent-shakedown-oc-cu
    base_name: TwoAgentShakedown
    tier: pr
    category: cross_channel
    description: >
      PR shakedown — openclaw hub vs cursor spoke. Verifies cross-family
      wake protocols. Consensus is best-effort; the assertion is that
      both agents joined and the session reached *some* terminal state
      within budget.
    topic: rollout-cadence
    timeout_seconds: 480       # 8 min — cursor cold-start hostile to default
    agents:
      - handle: planner
        adapter: openclaw
        host: hub
        position: >
          Ship every two weeks; no exceptions. Risk = feature flags +
          incremental rollout.
      - handle: designer
        adapter: cursor
        host: spoke1
        position: >
          Polish over pace; ship monthly with a hard quality gate.
    require_consensus: false   # cursor cold-start may eat the budget
    require_plan_file: false

  - name: two-agent-shakedown-he-he
    base_name: TwoAgentShakedown
    tier: pr
    category: core
    description: >
      PR hermes shakedown — two hermes agents negotiate via SSE polling,
      no explicit wake. Validates the mycelium-room plugin attends ticks
      and reaches consensus autonomously.
    topic: logging-verbosity
    agents:
      - handle: alpha-he
        adapter: hermes
        host: hub
        position: >
          Structured JSON logs everywhere; INFO default, DEBUG on errors.
          Human-readable only for local dev.
      - handle: beta-he
        adapter: hermes
        host: spoke1
        position: >
          Human-readable logs in all envs; JSON is a pipeline concern.
          Structured okay if human-readable stays available.
    require_consensus: true
    require_plan_file: true

  # 3-agent return-trip: the openclaw-only triple is fast enough to
  # squeeze into the PR tier and proves the round-robin proposer
  # rotation logic doesn't regress with N > 2.
  - name: three-agent-return-trip-oc-oc-oc
    base_name: ThreeAgentReturnTrip
    tier: pr
    category: core
    description: >
      PR triple — three openclaw agents across hub + both spokes.
      Validates proposer rotation, multi-agent join window, and the
      plan-compiler's N>2 path.

      Positions are designed to converge in <10 rounds: each agent
      voices a distinct concern (on-call burnout / hiring quality /
      tooling debt) with explicit common ground (everyone supports
      "fix on-call" + "tooling roadmap"). The 2026-06-07 lab run had
      hard-coded mutually-incompatible positions and bickered until
      CFN abort at round 8 — see scenarios.py history for the rewrite
      rationale.
    topic: capacity-planning
    agents:
      - handle: alpha
        adapter: openclaw
        host: hub
        position: >
          Top priority: fix the on-call rotation by end of Q1. Prefer
          2 SRE hires, but open to any combination (contractors,
          platform engineer, automation) that visibly cuts pager load
          this quarter.
      - handle: beta
        adapter: openclaw
        host: spoke1
        position: >
          Want 1 senior platform engineer in Q1 — quality over
          quantity. Supportive of short-term contractor backfill to
          relieve on-call while we recruit. Comfortable deferring
          additional headcount to Q2 if there's a clear plan.
      - handle: gamma
        adapter: openclaw
        host: spoke2
        position: >
          Push for a tooling-and-automation roadmap (alerting
          overhaul + runbook automation) as the durable fix. Can
          accept 1 headcount in Q1 if it's tied to an explicit
          automation milestone; would still flag budget pressure
          beyond that.
    require_consensus: true
    require_plan_file: true

  # ────────────────────────────────────────────────────────────────────
  #  Tier: NIGHTLY  (~60-minute budget, adapter-pair coverage)
  # ────────────────────────────────────────────────────────────────────

  - name: two-agent-consensus-cu-cu
    base_name: TwoAgentConsensus
    tier: nightly
    category: core
    description: >
      Cursor vs cursor on the hub + spoke. Catches cursor-only
      regressions in cold-spawn, workspace asset drift, or daemon
      subscription ordering.
    topic: storage-engine
    agents:
      - handle: alpha-cu
        adapter: cursor
        host: hub
        position: Pick Postgres for everything — we already operate it.
      - handle: beta-cu
        adapter: cursor
        host: spoke1
        position: Split — Postgres for OLTP, ClickHouse for analytics.

  - name: two-agent-consensus-he-he
    base_name: TwoAgentConsensus
    tier: nightly
    category: core
    description: >
      Hermes vs hermes — exercises the polling-driven autonomous
      coordination path (no explicit wake).
    topic: deployment-strategy
    agents:
      - handle: alpha-he
        adapter: hermes
        host: hub
        position: Blue-green on every deploy; rollback within 60s.
      - handle: beta-he
        adapter: hermes
        host: spoke1
        position: Canary at 5% → 25% → 100% over 24h.

  - name: three-agent-consensus-he-he-he
    base_name: ThreeAgentConsensus
    tier: nightly
    category: core
    description: >
      Three hermes agents across hub + both spokes — validates multi-agent
      proposer rotation entirely via the SSE polling path. Any failure is a
      hermes plugin or backend regression, not adapter noise.
    topic: incident-response-process
    agents:
      - handle: alpha-he
        adapter: hermes
        host: hub
        position: >
          Blameless post-mortems within 48h; SEV1 requires a written RCA.
          On-call should auto-page the owning team, not a shared pool.
      - handle: beta-he
        adapter: hermes
        host: spoke1
        position: >
          72h for post-mortems is fine; timeline varies with complexity.
          Shared on-call pool first, team escalation second.
      - handle: gamma-he
        adapter: hermes
        host: spoke2
        position: >
          Lightweight async retros for low-SEV; formal RCA only for SEV1.
          On-call: team-first with a global fallback.
    require_consensus: true
    require_plan_file: true

  - name: two-agent-consensus-oc-he
    base_name: TwoAgentConsensus
    tier: nightly
    category: cross_channel
    description: >
      Cross-family openclaw (Matrix DM wake) + hermes (poll wake) —
      verifies the room sub-tick fan-out covers both delivery paths
      simultaneously.
    topic: secrets-management
    agents:
      - handle: alpha
        adapter: openclaw
        host: hub
        position: Centralize on Vault; deprecate per-env secret files.
      - handle: beta-he
        adapter: hermes
        host: spoke1
        position: AWS Secrets Manager — Vault adds an extra dep we don't need.

  - name: two-agent-consensus-cu-he
    base_name: TwoAgentConsensus
    tier: nightly
    category: cross_channel
    description: >
      Cursor (invoke wake) + hermes (poll wake). Verifies that cursor's
      cold-spawn and hermes's polling co-exist on the same session.
    topic: monorepo-or-polyrepo
    agents:
      - handle: front-cu
        adapter: cursor
        host: hub
        position: Single monorepo with Bazel — sharing types is killing us.
      - handle: back-he
        adapter: hermes
        host: spoke1
        position: Polyrepo — coordination tax is small, build complexity is large.

  - name: three-agent-consensus-oc-cu-he
    base_name: ThreeAgentConsensus
    tier: nightly
    category: distributed
    description: >
      The full cross-family triple. Slow on cursor cold-spawn but the
      most diagnostic single row in the matrix — a regression here
      almost always means a real backend issue, not adapter flakiness.
    topic: observability-budget
    timeout_seconds: 900   # 15 min — cursor cold-spawn × 3 agents
    agents:
      - handle: planner
        adapter: openclaw
        host: hub
        position: Trace 100% of requests; we can afford the storage.
      - handle: designer
        adapter: cursor
        host: spoke1
        position: Sample at 10%, full trace on errors only.
      - handle: ops
        adapter: hermes
        host: spoke2
        position: Sample at 1%, retain 90 days; pay for retention not volume.

  # ────────────────────────────────────────────────────────────────────
  #  Tier: WEEKLY  (full grid + stress)
  # ────────────────────────────────────────────────────────────────────

  - name: two-agent-consensus-cu-oc
    base_name: TwoAgentConsensus
    tier: weekly
    category: cross_channel
    description: Mirror of oc-cu — confirms the wake protocol is symmetric.
    topic: caching-tier
    agents:
      - handle: alpha-cu
        adapter: cursor
        host: hub
        position: Redis everywhere; we already pay for it.
      - handle: beta
        adapter: openclaw
        host: spoke1
        position: Memcached for hot paths; Redis for state.

  - name: two-agent-consensus-he-oc
    base_name: TwoAgentConsensus
    tier: weekly
    category: cross_channel
    description: Mirror of oc-he.
    topic: auth-provider
    agents:
      - handle: alpha-he
        adapter: hermes
        host: hub
        position: Auth0 — managed service, fewer surprises.
      - handle: beta
        adapter: openclaw
        host: spoke1
        position: Self-host Keycloak — vendor lock-in concern is real.

  - name: two-agent-consensus-he-cu
    base_name: TwoAgentConsensus
    tier: weekly
    category: cross_channel
    description: Mirror of cu-he.
    topic: ci-runner-pool
    agents:
      - handle: alpha-he
        adapter: hermes
        host: hub
        position: GitHub-hosted runners — zero ops overhead.
      - handle: beta-cu
        adapter: cursor
        host: spoke1
        position: Self-hosted on bare metal — cost + speed.

  - name: timeout-as-valid-oc-oc
    base_name: TimeoutAsValid
    tier: weekly
    category: core
    description: >
      Two diametrically opposed openclaw agents with a tight round
      budget — designed to time out cleanly. Verifies the
      ``broken: true`` consensus envelope path.
    topic: licensing-model
    n_steps_total: 4         # deliberately too short to converge
    agents:
      - handle: lawyer-a
        adapter: openclaw
        host: hub
        position: >
          GPLv3 only; no exceptions. Hard limit: no commercial
          relicensing under any circumstance.
      - handle: lawyer-b
        adapter: openclaw
        host: spoke1
        position: >
          Apache-2.0 only; copyleft licenses are non-starters for
          enterprise adoption.
    require_consensus: false   # expect the broken envelope
    require_plan_file: false
