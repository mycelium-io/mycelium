---
# Hermes adapter E2E tests — datafile for tests 85 and 89.
#
# Covers: gateway PID file format handling and loop-suppression deque eviction.
#
# Prerequisites:
#   - hermes installed on hub (oclw4)
#   - mycelium CLI updated to feat/hermes on all devices
#   - hermes gateway running:  hermes gateway start
#   - SSH key at $SSH_KEY_PATH (default: ~/.ssh/ioc.pem)
#
# Env overrides (all optional):
#   OCLW4_IP, OCLW3_IP, OCLW5_IP   — host IPs
#   SSH_KEY_PATH                    — path to SSH private key
#   SSH_USER                        — SSH login user (default: ubuntu)

parameters:

  topology:
    backend:
      base_url: "%ENV{MYCELIUM_BACKEND_URL, http://localhost:8000}"
      api_path: "/api"
      health_path: "/health"

  ssh:
    key_path: "%ENV{SSH_KEY_PATH, ~/.ssh/ioc.pem}"
    user: "%ENV{SSH_USER, ubuntu}"
    connect_timeout: 5

  max_failures: 3
  log_dir: "%ENV{MYCELIUM_E2E_LOG_DIR, ~/.mycelium/e2e-logs}"

  # ── Hermes-specific topology ─────────────────────────────────────────
  hermes:
    hub_host:   "%ENV{OCLW4_IP, 10.0.50.125}"
    spoke1_host: "%ENV{OCLW3_IP, 10.0.50.171}"
    spoke2_host: "%ENV{OCLW5_IP, 10.0.50.142}"

    # hermes gateway log path (relative to $HERMES_HOME)
    gateway_log: "logs/gateway.log"

  # ── Timeout overrides for hermes (polling adapter is slower) ─────────
  timeouts:
    http_default: 10
    cli_default: 30
    convergence_poll: 15
    agent_create_wait: 90      # gateway restarts on adapter add
    session_spawn_wait: 30

# ── Per-Testcase UIDs ────────────────────────────────────────────────

testcases:
  HermesGatewayPidFormats:
    uid: "mycelium:e2e:hermes:085"

  HermesLoopSuppression:
    uid: "mycelium:e2e:hermes:089"
