---
# All-in-one CFN suite datafile — single-device topology, all services localhost.
#
# Runs hub-only scenarios (all agents on the hub) against a locally running
# mycelium + Go CFN stack. No spoke devices required. Suitable for oclw4
# standalone validation before a hub-and-spoke run.
extends: local_datafile.yaml

parameters:
  timeouts:
    negotiation_wait: 480   # cursor cold-spawn needs headroom
    agent_idle_wait: 15
