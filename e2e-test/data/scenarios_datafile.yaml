---
# Scenarios datafile — used by the three-axis matrix suite
# (``suites/scenarios_suite.py``) and its dynamically generated
# testcase classes (``TwoAgentConsensus_oc_oc`` etc.).
#
# Unlike suite-specific datafiles, this file deliberately has NO
# ``testcases:`` block — the matrix generates its own class names at
# import time and pyATS errors on any ``testcases:`` entry that
# doesn't match a class in the loaded testscript. Per-row parameters
# live in ``data/scenarios.yaml`` and are wired into each generated
# class via ``_row``.
#
# Environment-specific overrides (compose / lab) sit on top via
# pyATS ``extends:`` — see ``ci_datafile.yaml``.

extends: base_datafile.yaml

parameters:
  # Abort early to save runner minutes and LLM credits when infra
  # is broken. Scenarios suite respects this via the easypy harness.
  max_failures: 3
