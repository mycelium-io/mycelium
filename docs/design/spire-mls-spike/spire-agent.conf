# Minimal SPIRE agent for the #583 spike. Exposes the Workload API on a Unix
# socket the host-side Python members read via SPIRE_SOCKET.
agent {
    data_dir = "/opt/spire/data/agent"
    log_level = "INFO"
    trust_domain = "mycelium.dev"
    server_address = "spire-server"
    server_port = "8081"
    # Dev-only: trust the server's bootstrap bundle over the join-token flow.
    insecure_bootstrap = true
    socket_path = "/tmp/spire-agent/public/api.sock"
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "memory" {
        plugin_data {}
    }

    # unix workload attestor: both members run as the same host uid, so both
    # workload entries are selected by unix:uid. Each Python process then picks
    # its own SVID via SpireConfig.target_spiffe_id.
    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
