# Minimal SPIRE server for the #583 spike. Trust domain matches the SPIFFE IDs
# minted for the two MLS members (spiffe://mycelium.dev/agent/{alice,bob}).
server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "mycelium.dev"
    data_dir = "/opt/spire/data/server"
    log_level = "INFO"
    ca_ttl = "24h"
    default_x509_svid_ttl = "1h"
    default_jwt_svid_ttl = "5m"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/opt/spire/data/server/datastore.sqlite3"
        }
    }

    # join_token node attestor: simplest deterministic path for a spike. The
    # agent boots with a one-time token minted by run.sh.
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/server/keys.json"
        }
    }
}
