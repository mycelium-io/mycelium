# Cross-repo edges for the tiny-teams-with-tokens ingest agent.
# https://github.com/juliarvalenti/tiny-teams-with-tokens
#
# Schema: depends_on / consumed_by / supersedes / related, each a list of
# "owner/name". All keys optional. The TTT agent uses these to ground the
# project's architecture pages in maintainer-asserted edges instead of
# guessing them from grep.

depends_on:
  # Both are docker-composed alongside mycelium-backend in the `cfn`
  # profile (mycelium-cli/src/mycelium/docker/compose.yml). Mycelium
  # registers itself with the mgmt plane and routes extraction through
  # the cognition fabric node.
  - outshift-open/ioc-cfn-mgmt-plane-svc        # agent + memory-provider registration
  - outshift-open/ioc-cognition-fabric-node-svc # extraction + evidence routing

related:
  # Reached transitively via the CFN node, not a direct mycelium runtime
  # edge — but maintainers in this neighborhood should know about them.
  - outshift-open/ioc-cfn-cognition-engines     # two-stage LLM extraction backend (services/cfn_knowledge.py)
  - cisco-eti/ioc-cfn-cognitive-agents          # embedding-stack alignment (services/embedding.py)
  - outshift-open/ioc-cfn-mgmt-backend-svc      # broader CFN management plane (README §Architecture)
