name: CFN contract

# Validate that mycelium-backend's assumptions about the CFN HTTP API still
# hold against whatever CFN image is pinned in compose.yml. Triggers when the
# pin changes (i.e. when a contributor bumps the version) so PR review surfaces
# any contract regressions before merge. Also runs nightly on main as a canary
# against the pinned version drifting out of compatibility with the running CFN
# Docker images on ghcr.

on:
  pull_request:
    paths:
      - mycelium-cli/src/mycelium/docker/compose.yml
      - fastapi-backend/app/services/cfn_negotiation.py
      - fastapi-backend/app/services/coordination.py
      - fastapi-backend/tests/test_cfn_contract.py
      - fastapi-backend/tests/fixtures/cfn/**
      - .github/workflows/cfn-contract.yml
  schedule:
    # Daily at 14:00 UTC, weekdays only — gives the CFN team a few hours after
    # a typical morning release for our canary to catch regressions.
    - cron: "0 14 * * 1-5"
  workflow_dispatch:

jobs:
  contract:
    name: CFN contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Bring up CFN stack via compose
        # Use the project's actual compose file so we exercise the same
        # containers + healthchecks + service-dependency wiring that runs
        # locally. This avoids race conditions from imperative `docker run`
        # ordering. We only start the CFN-related services (db + mgmt + node);
        # mycelium-backend is not needed for contract tests.
        env:
          LLM_MODEL: anthropic/claude-haiku-4-5-20251001
          LLM_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          docker compose \
            -f mycelium-cli/src/mycelium/docker/compose.yml \
            --profile cfn \
            up -d mycelium-db ioc-cfn-mgmt-plane-svc ioc-cognition-fabric-node-svc

      - name: Wait for CFN node-svc to be healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' ioc-cognition-fabric-node-svc 2>/dev/null || echo "missing")
            if [ "$status" = "healthy" ]; then
              echo "CFN node healthy after ${i} attempts"
              exit 0
            fi
            sleep 3
          done
          echo "CFN node failed to become healthy"
          docker logs ioc-cognition-fabric-node-svc 2>&1 | tail -50 || true
          docker logs ioc-cfn-mgmt-plane-svc 2>&1 | tail -30 || true
          exit 1

      - name: Provision workspace + MAS via CFN mgmt plane
        id: provision
        run: |
          ws_resp=$(curl -sf -X POST http://localhost:9000/api/workspaces \
            -H "Content-Type: application/json" \
            -d '{"name":"ci-contract"}')
          ws=$(echo "$ws_resp" | python3 -c "import sys,json;print(json.load(sys.stdin)['workspace_id'])")
          mas_resp=$(curl -sf -X POST "http://localhost:9000/api/workspaces/$ws/multi-agentic-systems" \
            -H "Content-Type: application/json" \
            -d '{"name":"ci-contract-mas"}')
          mas=$(echo "$mas_resp" | python3 -c "import sys,json;print(json.load(sys.stdin)['mas_id'])")
          echo "workspace_id=$ws" >> "$GITHUB_OUTPUT"
          echo "mas_id=$mas" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: fastapi-backend
        run: uv sync --group dev

      - name: Run contract tests
        working-directory: fastapi-backend
        env:
          MYCELIUM_CFN_CONTRACT_TESTS: "1"
          COGNITION_FABRIC_NODE_URL: http://localhost:9002
          WORKSPACE_ID: ${{ steps.provision.outputs.workspace_id }}
          CFN_CONTRACT_MAS_ID: ${{ steps.provision.outputs.mas_id }}
        run: uv run pytest tests/test_cfn_contract.py -v

      - name: Dump CFN logs on failure
        if: failure()
        run: |
          echo "── ioc-cognition-fabric-node-svc ──"
          docker logs ioc-cognition-fabric-node-svc 2>&1 | tail -100 || true
          echo "── ioc-cfn-mgmt-plane-svc ──"
          docker logs ioc-cfn-mgmt-plane-svc 2>&1 | tail -50 || true
