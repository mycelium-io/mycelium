name: Nightly

# Tier 2: everything too slow, too paid, or too dependent on a real stack to sit
# on the PR path. The PR run is ~95s and that is a property worth defending, so
# the checks that would eat it live here instead — once a night, against `main`,
# where a failure opens an issue rather than blocking a person.
on:
  schedule:
    # 04:00 UTC — after the day's merges, before anyone reads the result.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-path:
    # The one flow every user takes and no test covers: install the CLI, bring
    # the whole stack up from compose, and use it. Unit tests run against temp
    # directories and fakes, so the class of bug this catches — the compose
    # topology changing and the CLI's view of it not following — is invisible to
    # them right up until someone's `mycelium up` half-works.
    name: Install path (full stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Generate OpenAPI client
        run: SPEC_FILE=openapi.json bash scripts/gen-mycelium-client.sh

      # From source, not from the published release: the point is to check this
      # commit's CLI against this commit's compose file. install.sh's own job is
      # fetching a release, which is release.yml's business.
      - name: Install the CLI
        run: |
          uv tool install -e ./mycelium-cli \
            --with mycelium-backend-client@./mycelium-client --force
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: mycelium install
        run: mycelium install --non-interactive --yes

      - name: Backend answers /health
        run: |
          # Read the port back rather than assuming 8000: install picks the next
          # free one when 8000 is taken, and a runner is not guaranteed to be
          # quiet. `.env` is the generated file every container reads.
          port=$(grep '^MYCELIUM_BACKEND_PORT=' "$HOME/.mycelium/.env" | cut -d= -f2)
          echo "MYCELIUM_API=http://localhost:${port:-8000}" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            if curl -sf "http://localhost:${port:-8000}/health" > /tmp/health.json; then
              python3 -m json.tool /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "::error::the backend never became healthy"
          docker ps -a
          docker logs mycelium-backend 2>&1 | tail -50
          exit 1

      # `--json` reports every check and exits 0, so the run decides what is
      # fatal. LLM connectivity is not: no key is configured here, and failing
      # the nightly over that would train everyone to ignore it.
      - name: mycelium doctor
        run: |
          mycelium --json doctor > /tmp/doctor.json || true
          cat /tmp/doctor.json
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          report = json.loads(Path("/tmp/doctor.json").read_text())
          excused = {"LLM connectivity"}
          failed = [
              c for c in report["checks"]
              if c["status"] == "error" and c["name"] not in excused
          ]
          for check in failed:
              print(f"::error::doctor: {check['name']}: {check['message']}")
          sys.exit(1 if failed else 0)
          PY

      - name: Room, memory, search
        run: |
          set -x
          mycelium room create nightly-check
          mycelium room use nightly-check
          mycelium memory set decisions/cutover \
            "Cut over the Atlas catalog in a staged release." -H nightly
          mycelium memory get decisions/cutover | grep -q "staged release"
          mycelium memory ls
          mycelium search "staged release"

      - name: mycelium down
        if: always()
        run: |
          mycelium down
          # `down` is only done when nothing is left behind; a container that
          # survives it is exactly the drift the compose contract test guards.
          if docker ps --format '{{.Names}}' | grep -E '^mycelium-'; then
            echo '::error::containers survived mycelium down'
            exit 1
          fi

      - name: Backend logs (on failure)
        if: failure()
        run: docker logs mycelium-backend 2>&1 | tail -100 || true

  cognition:
    # The aligner's Pi brain and the plan compiler, run for real. Everywhere else
    # they are faked, so the behaviour that defines the product — structuring
    # prose into issues, reading an agreement as an agreement, stopping at
    # unanimity instead of the step cap — has never been exercised in CI.
    #
    # Costs tokens, so it needs a key. Without one it reports and passes rather
    # than failing: a fork has no secrets, and a red nightly nobody can fix is
    # worse than an honest skip.
    name: Cognition (live LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for a model key
        id: key
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -n "$LLM_API_KEY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No LLM_API_KEY configured; the live cognition slice was skipped."
          fi

      - name: Set up Node
        if: steps.key.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # The aligner's brain is this binary; the backend image ships it, and a
      # host-run backend (which is what this job is) needs it on PATH.
      - name: Install the Pi coding agent
        if: steps.key.outputs.run == 'true'
        run: npm install -g @mariozechner/pi-coding-agent

      - name: Install uv
        if: steps.key.outputs.run == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        if: steps.key.outputs.run == 'true'
        run: uv python install 3.12

      - name: Install dependencies
        if: steps.key.outputs.run == 'true'
        working-directory: fastapi-backend
        run: uv sync --group dev

      - name: Negotiate to convergence, then compile the plan
        if: steps.key.outputs.run == 'true'
        working-directory: fastapi-backend
        env:
          MYCELIUM_LLM_TESTS: "1"
          MYCELIUM_STUB_EMBEDDINGS: "1"
          LLM_MODEL: ${{ vars.LLM_MODEL || 'anthropic/claude-sonnet-4-6' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: >-
          uv run pytest -q
          tests/test_cognition_live.py
          tests/test_plan_compiler.py
          tests/test_synthesizer_live.py

  report:
    # A nightly that fails silently is a nightly nobody reads, and one that opens
    # a fresh issue every night is one everybody mutes. So: one open issue,
    # commented on each time it recurs, closed by hand when it is fixed.
    name: Report failures
    runs-on: ubuntu-latest
    needs: [install-path, cognition]
    if: ${{ failure() }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the nightly issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Nightly checks are failing"
        run: |
          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')
          body=$(printf '%s\n\n| Job | Result |\n| --- | --- |\n| Install path | %s |\n| Cognition | %s |\n' \
            "The nightly run failed: $RUN_URL" \
            "${{ needs.install-path.result }}" \
            "${{ needs.cognition.result }}")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
