name: Nightly

# Tier 2: the checks too slow, too paid, or too dependent on a real stack for
# the PR path. Once a night against `main`; a failure opens an issue rather than
# blocking a person.
on:
  schedule:
    # 04:00 UTC — after the day's merges, before anyone reads the result.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Run one part: install-path, cognition or agent-clis (default: all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-path:
    # Install the CLI, bring the whole stack up from compose, and use it. Unit
    # tests run against temp directories and fakes, so compose topology drifting
    # from the CLI's view of it is invisible to them.
    name: Install path (full stack)
    if: ${{ !inputs.only || inputs.only == 'install-path' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Generate OpenAPI client
        run: SPEC_FILE=openapi.json bash scripts/gen-mycelium-client.sh

      # From source, so this commit's CLI is checked against this commit's
      # compose file. Fetching a release is release.yml's business.
      - name: Install the CLI
        run: |
          uv tool install -e ./mycelium-cli \
            --with mycelium-backend-client@./mycelium-client --force
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The backend image's process runs as a fixed uid (1000). The bind-mounted
      # ~/.mycelium this creates is owned by whatever uid invoked `mycelium
      # install` — on GitHub-hosted runners that's `runner`, uid 1001, not 1000 —
      # so without this the container can't write its own data dir and the
      # ASGI lifespan crashes on startup (PermissionError on `rooms/`), which
      # compose reports as "unhealthy" within a couple seconds. Same fix
      # e2e-test's own CI already needed for this exact class of problem.
      - name: Prep ~/.mycelium for the backend's fixed uid
        run: |
          mkdir -p ~/.mycelium
          chmod -R 777 ~/.mycelium
          sudo setfacl -R -d -m o::rwx ~/.mycelium 2>/dev/null || true

      - name: mycelium install
        run: mycelium install --non-interactive --yes

      - name: Backend answers /health
        run: |
          # Install picks the next free port when 8000 is taken, so read it
          # back from the generated `.env` rather than assuming.
          port=$(grep '^MYCELIUM_BACKEND_PORT=' "$HOME/.mycelium/.env" | cut -d= -f2)
          echo "MYCELIUM_API=http://localhost:${port:-8000}" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            if curl -sf "http://localhost:${port:-8000}/health" > /tmp/health.json; then
              python3 -m json.tool /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "::error::the backend never became healthy"
          docker ps -a
          docker logs mycelium-backend 2>&1 | tail -50
          exit 1

      # The backend (uid 1000) writes into the bind-mounted ~/.mycelium while
      # coming up (rooms/, config), leaving those specific files owned by 1000
      # even though the dir itself is 777 — `mycelium doctor`'s ownership
      # check (and later agent/memory writes run as this job's own uid) flags
      # that as broken. Same fix `mycelium doctor` itself suggests, already
      # used in e2e-test's own CI.
      - name: Reclaim ~/.mycelium ownership after backend startup
        run: sudo chown -R "$USER" ~/.mycelium 2>/dev/null || true

      # `--json` reports every check and exits 0, so the run decides what is
      # fatal. LLM connectivity is not — no key is configured here.
      - name: mycelium doctor
        run: |
          mycelium --json doctor > /tmp/doctor.json || true
          cat /tmp/doctor.json
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          report = json.loads(Path("/tmp/doctor.json").read_text())
          excused = {"LLM connectivity"}
          failed = [
              c for c in report["checks"]
              if c["status"] == "error" and c["name"] not in excused
          ]
          for check in failed:
              print(f"::error::doctor: {check['name']}: {check['message']}")
          sys.exit(1 if failed else 0)
          PY

      - name: Room, memory, search
        run: |
          set -x
          mycelium room create nightly-check
          mycelium room use nightly-check
          mycelium memory set decisions/cutover \
            "Cut over the Atlas catalog in a staged release." -H nightly
          mycelium memory get decisions/cutover | grep -q "staged release"
          mycelium memory ls
          mycelium memory search "staged release"

      # Must run before `mycelium down` — that step (if: always()) removes
      # the container, and a step ordered after it can never see its logs
      # (docker logs then just reports "No such container").
      - name: Backend logs (on failure)
        if: failure()
        run: docker logs mycelium-backend 2>&1 | tail -100 || true

      - name: mycelium down
        if: always()
        run: |
          mycelium down
          # `down` is only done when nothing is left behind.
          if docker ps --format '{{.Names}}' | grep -E '^mycelium-'; then
            echo '::error::containers survived mycelium down'
            exit 1
          fi

  cognition:
    # The aligner's Pi brain and the plan compiler, run for real: structuring
    # prose into issues, reading an agreement as an agreement, stopping at
    # unanimity instead of the step cap. Costs tokens, so it needs a key; without
    # one it reports and passes, since a fork has no secrets.
    name: Cognition (live LLM)
    if: ${{ !inputs.only || inputs.only == 'cognition' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for a model key
        id: key
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -n "$LLM_API_KEY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No LLM_API_KEY configured; the live cognition slice was skipped."
          fi

      - name: Set up Node
        if: steps.key.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # The aligner's brain. The backend image ships it; a host-run backend
      # needs it on PATH.
      - name: Install the Pi coding agent
        if: steps.key.outputs.run == 'true'
        run: npm install -g @earendil-works/pi-coding-agent

      - name: Install uv
        if: steps.key.outputs.run == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        if: steps.key.outputs.run == 'true'
        run: uv python install 3.12

      - name: Install dependencies
        if: steps.key.outputs.run == 'true'
        working-directory: fastapi-backend
        run: uv sync --group dev

      - name: Negotiate to convergence, then compile the plan
        if: steps.key.outputs.run == 'true'
        working-directory: fastapi-backend
        env:
          MYCELIUM_LLM_TESTS: "1"
          MYCELIUM_STUB_EMBEDDINGS: "1"
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'anthropic/claude-sonnet-4-6' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: >-
          uv run pytest -q
          tests/test_cognition_live.py
          tests/test_task_compiler.py
          tests/test_synthesizer_live.py

  agent-clis-plan:
    # Every agent CLI the app can start (integrations/agents KNOWN), with the
    # command that installs its latest release, as the matrix below.
    name: Agent CLIs (plan)
    if: ${{ !inputs.only || inputs.only == 'agent-clis' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      clis: ${{ steps.plan.outputs.clis }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Generate OpenAPI client
        run: SPEC_FILE=openapi.json bash scripts/gen-mycelium-client.sh
      - name: List the CLIs
        id: plan
        working-directory: mycelium-cli
        run: echo "clis=$(uv run python -m mycelium.runner.smoke plan)" >> "$GITHUB_OUTPUT"

  agent-clis:
    # Each CLI at its latest release, started the way the runner starts it (a
    # herdr pane, our launch arguments), with no key. Catches what a new user
    # hits before the model is ever called: a flag a CLI stopped accepting, a
    # shell that never reaches its prompt, herdr's first run in the way, a
    # sign-in the runner can't report. Free; Linux, since herdr ships for it.
    name: Agent CLI start-up (${{ matrix.cli.name }})
    needs: agent-clis-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cli: ${{ fromJSON(needs.agent-clis-plan.outputs.clis) }}
    env:
      HERDR_TAG: v0.9.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Generate OpenAPI client
        run: SPEC_FILE=openapi.json bash scripts/gen-mycelium-client.sh
      - name: Install ${{ matrix.cli.name }}, latest release
        env:
          INSTALL: ${{ matrix.cli.install }}
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bash -c "$INSTALL"
          # An installer that puts the CLI in a folder of its own adds that
          # folder to a shell startup file (~/.bashrc or ~/.bash_profile), as a
          # person's new terminal would read it. Take what it added under $HOME.
          for shell in -ic -lic; do
            env -i HOME="$HOME" bash "$shell" 'printf "%s" "$PATH"' 2>/dev/null \
              | tr ':' '\n' | grep "^$HOME/" >> "$GITHUB_PATH" || true
          done
      # Started after the CLI is installed, so its panes' shells find it.
      - name: Start herdr
        run: |
          curl -fsSL -o "$HOME/.local/bin/herdr" \
            "https://github.com/herdrdev/herdr/releases/download/$HERDR_TAG/herdr-linux-x86_64"
          chmod +x "$HOME/.local/bin/herdr"
          nohup herdr server > "$RUNNER_TEMP/herdr.log" 2>&1 &
          for _ in $(seq 1 30); do herdr workspace list > /dev/null 2>&1 && exit 0; sleep 1; done
          echo "::error::herdr's server never answered"
          cat "$RUNNER_TEMP/herdr.log"
          exit 1
      - name: Start it as the runner does
        working-directory: mycelium-cli
        run: >-
          uv run python -m mycelium.runner.smoke run "${{ matrix.cli.cli }}"
          --out "$RUNNER_TEMP/smoke-${{ matrix.cli.cli }}.json"
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ matrix.cli.cli }}
          path: ${{ runner.temp }}/smoke-${{ matrix.cli.cli }}.json
          if-no-files-found: ignore

  agent-clis-live:
    # The paid half, for the two CLIs most people start: signed in with its
    # cheapest model, started by the runner's host in a room on a throwaway
    # hub, mentioned, and expected to answer there without stopping at a
    # permission prompt. A few cents a night. Without its key a CLI reports
    # and passes, since a fork has no secrets.
    name: Agent CLI end to end (${{ matrix.cli }})
    if: ${{ !inputs.only || inputs.only == 'agent-clis' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cli: [claude, codex]
    # The keys are given only to the steps that use them, never to the ones
    # that run an installer or download something.
    env:
      HERDR_TAG: v0.9.3
      SLIMCTL_TAG: slimctl-v2.1.1
    steps:
      - name: Check for its key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.NIGHTLY_ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.NIGHTLY_OPENAI_API_KEY }}
        run: |
          if [ "${{ matrix.cli }}" = claude ]; then key="$ANTHROPIC_API_KEY"; else key="$OPENAI_API_KEY"; fi
          if [ -n "$key" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No key for ${{ matrix.cli }}; its end-to-end check was skipped."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.run == 'true'
      - name: Install uv
        if: steps.key.outputs.run == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Set up Python
        if: steps.key.outputs.run == 'true'
        run: uv python install 3.12
      - name: Set up Node
        if: steps.key.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the CLI, the agent CLI and herdr
        if: steps.key.outputs.run == 'true'
        run: |
          SPEC_FILE=openapi.json bash scripts/gen-mycelium-client.sh
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install -e ./mycelium-cli --with mycelium-backend-client@./mycelium-client --force
          bash -c "$(cd mycelium-cli && uv run python -c \
            "from mycelium.integrations.agents import by_id; print(by_id('${{ matrix.cli }}').install)")"
          curl -fsSL -o "$HOME/.local/bin/herdr" \
            "https://github.com/herdrdev/herdr/releases/download/$HERDR_TAG/herdr-linux-x86_64"
          chmod +x "$HOME/.local/bin/herdr"
      # A machine where the person already signed in and trusted the folder:
      # what's being checked is the work after that, not the first run (the
      # start-up job above covers that).
      - name: Sign it in
        if: steps.key.outputs.run == 'true'
        env:
          WORK: ${{ runner.temp }}/live-${{ matrix.cli }}
          ANTHROPIC_API_KEY: ${{ secrets.NIGHTLY_ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.NIGHTLY_OPENAI_API_KEY }}
        run: |
          mkdir -p "$WORK"
          if [ "${{ matrix.cli }}" = claude ]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          key = os.environ["ANTHROPIC_API_KEY"]
          Path.home().joinpath(".claude.json").write_text(json.dumps({
              "hasCompletedOnboarding": True,
              "customApiKeyResponses": {"approved": [key[-20:]], "rejected": []},
              "projects": {os.environ["WORK"]: {"hasTrustDialogAccepted": True}},
          }))
          PY
          else
            printenv OPENAI_API_KEY | codex login --with-api-key
            mkdir -p "$HOME/.codex"
            printf 'model = "gpt-5-mini"\n\n[projects."%s"]\ntrust_level = "trusted"\n' "$WORK" \
              >> "$HOME/.codex/config.toml"
          fi
      - name: Start a SLIM node, a hub and herdr
        if: steps.key.outputs.run == 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/slimctl.tgz" \
            "https://github.com/agntcy/slim/releases/download/$SLIMCTL_TAG/slimctl-linux-amd64-gnu.tar.gz"
          tar -xzf "$RUNNER_TEMP/slimctl.tgz" -C "$RUNNER_TEMP"
          slimctl=$(find "$RUNNER_TEMP" -type f -name slimctl | head -n 1)
          nohup "$slimctl" slim start --endpoint 127.0.0.1:46357 > "$RUNNER_TEMP/slim.log" 2>&1 &
          (cd fastapi-backend && uv sync -q && \
            MYCELIUM_DATA_DIR="$RUNNER_TEMP/hub" MYCELIUM_STUB_EMBEDDINGS=1 \
            MYCELIUM_SLIM_ENDPOINT=http://127.0.0.1:46357 \
            nohup uv run uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/hub.log" 2>&1 &)
          nohup herdr server > "$RUNNER_TEMP/herdr.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && herdr workspace list > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::error::the hub or herdr never answered"
          tail -40 "$RUNNER_TEMP/hub.log" "$RUNNER_TEMP/herdr.log" "$RUNNER_TEMP/slim.log"
          exit 1
      - name: Mention it and wait for its answer
        if: steps.key.outputs.run == 'true'
        working-directory: mycelium-cli
        env:
          ANTHROPIC_API_KEY: ${{ secrets.NIGHTLY_ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.NIGHTLY_OPENAI_API_KEY }}
          # Claude Code's cheapest model; Codex's is set in its config above.
          ANTHROPIC_MODEL: claude-haiku-4-5
        run: >-
          uv run python -m mycelium.runner.smoke live "${{ matrix.cli }}"
          --api http://127.0.0.1:8000
          --cwd "$RUNNER_TEMP/live-${{ matrix.cli }}"
          --pass ANTHROPIC_API_KEY --pass ANTHROPIC_MODEL --pass OPENAI_API_KEY
          --out "$RUNNER_TEMP/smoke-live-${{ matrix.cli }}.json"
      - name: Hub log (on failure)
        if: failure() && steps.key.outputs.run == 'true'
        run: tail -60 "$RUNNER_TEMP/hub.log" || true
      - name: Keep the result
        if: always() && steps.key.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-live-${{ matrix.cli }}
          path: ${{ runner.temp }}/smoke-live-${{ matrix.cli }}.json
          if-no-files-found: ignore

  agent-clis-report:
    # One open issue for the agent CLIs, apart from the rest of the nightly,
    # saying which CLI failed which check, with its pane's screen.
    name: Report agent CLI failures
    runs-on: ubuntu-latest
    needs: [agent-clis, agent-clis-live]
    # From main only: a run dispatched on a branch to try the job says its
    # results in the run, not in an issue.
    if: >-
      ${{ always() && github.ref == 'refs/heads/main'
      && (needs.agent-clis.result == 'failure' || needs.agent-clis-live.result == 'failure') }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Generate OpenAPI client
        run: SPEC_FILE=openapi.json bash scripts/gen-mycelium-client.sh
      - name: Collect the results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: smoke-*
          path: ${{ runner.temp }}/smoke
          merge-multiple: true
      - name: Open or update the agent CLI issue
        working-directory: mycelium-cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Nightly agent CLI checks are failing"
        run: |
          {
            echo "An agent CLI the app starts failed a nightly check: $RUN_URL"
            echo
            uv run python -m mycelium.runner.smoke report "$RUNNER_TEMP"/smoke/*.json
          } > "$RUNNER_TEMP/body.md"
          existing=$(gh issue list --repo "$GH_REPO" --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GH_REPO" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --repo "$GH_REPO" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi

  report:
    # One open issue, commented on each time the failure recurs, closed by hand
    # when it is fixed — a fresh issue per night gets muted.
    name: Report failures
    runs-on: ubuntu-latest
    needs: [install-path, cognition]
    if: ${{ failure() }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the nightly issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Nightly checks are failing"
        run: |
          # This job has no checkout step (it only needs the API, not the
          # source), so `gh` has no local git repo to detect the target
          # from — every call must name --repo explicitly or it fails with
          # "fatal: not a git repository".
          existing=$(gh issue list --repo "$GH_REPO" --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')
          body=$(printf '%s\n\n| Job | Result |\n| --- | --- |\n| Install path | %s |\n| Cognition | %s |\n' \
            "The nightly run failed: $RUN_URL" \
            "${{ needs.install-path.result }}" \
            "${{ needs.cognition.result }}")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GH_REPO" --body "$body"
          else
            gh issue create --repo "$GH_REPO" --title "$TITLE" --body "$body"
          fi
