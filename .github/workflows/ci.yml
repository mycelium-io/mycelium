name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default; the timing job asks for `actions: read` on top of this.
permissions:
  contents: read

# A branch only needs its newest commit checked. Superseded runs are cancelled
# rather than left to finish, which keeps queue time (and therefore the wall
# clock a human waits on) from backing up behind a push that no longer matters.
# Never on main: those runs are the record of what landed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    # Repo-level contracts that have no other home: actions pinned to SHAs,
    # workflows declaring their permissions, budgets that still name real jobs.
    # No toolchain install — it's stdlib Python over the workflow files, so it
    # finishes long before the jobs that build something.
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Workflow contracts
        run: python3 scripts/check_workflows.py

  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest

    # No database service: the SLIM-native rebuild removed Postgres/AgensGraph
    # (memory is markdown + a local JSONL index). The live-node SLIM slices run
    # in the `integration-slim` job below.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: fastapi-backend
        run: uv sync --group dev

      - name: Lint
        working-directory: fastapi-backend
        run: uv run ruff check .

      - name: Format check
        working-directory: fastapi-backend
        run: uv run ruff format --check .

      - name: Type check (ty)
        working-directory: fastapi-backend
        run: uv run ty check .

      # The committed openapi.json is the source of truth the OpenAPI client is
      # generated from (#613). Fail if it drifts from the live app, so an API
      # change can't ship a stale spec (which would regenerate a stale client).
      - name: OpenAPI spec is current
        working-directory: fastapi-backend
        run: |
          uv run python - <<'PY'
          import json, sys
          from app.main import app
          committed = json.load(open("../openapi.json"))
          if app.openapi() != committed:
              print("::error file=openapi.json::openapi.json is stale — run scripts/snapshot-openapi.sh and commit it (the OpenAPI client is generated from this spec).")
              sys.exit(1)
          print("openapi.json matches the backend.")
          PY

      # Fast gate: the core protocol (room -> engine -> await -> respond ->
      # converge -> plan) over the fake stack — no node, no LLM. Runs first so a
      # broken happy path fails in seconds, ahead of the full suite.
      - name: Smoke (fake stack)
        working-directory: fastapi-backend
        run: uv run pytest -m smoke -q

      - name: Unit tests
        working-directory: fastapi-backend
        env:
          MYCELIUM_STUB_EMBEDDINGS: "1"
        run: uv run pytest tests/ -x -q

  test-cli:
    name: CLI lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      # The OpenAPI client is a build artifact, not committed (#613). Generate it
      # from the committed openapi.json (no backend needed) before anything imports
      # `mycelium_backend_client`.
      - name: Generate OpenAPI client
        run: SPEC_FILE=openapi.json bash scripts/gen-mycelium-client.sh

      - name: Install dependencies
        working-directory: mycelium-cli
        run: uv sync --group dev --extra engine

      - name: Lint
        working-directory: mycelium-cli
        run: uv run ruff check src/

      - name: Format check
        working-directory: mycelium-cli
        run: uv run ruff format --check src/

      - name: Type check (ty)
        working-directory: mycelium-cli
        run: uv run ty check .

      # Unit suite (guarded live-node slices skip without a node; those run in
      # the integration-slim job). Previously the CLI had no test step in CI.
      - name: Unit tests
        working-directory: mycelium-cli
        run: uv run pytest tests/ -q

      # scripts/ sits outside both lint roots (fastapi-backend and mycelium-cli
      # each check only their own tree), so the maintainer scripts — including
      # the CI gates themselves — were checked by nobody. They ride along here
      # rather than in their own job: the toolchain is already installed, so it
      # costs seconds. Config is the repo-root ruff.toml.
      - name: Lint maintainer scripts
        working-directory: mycelium-cli
        run: |
          uv run ruff check --config ../ruff.toml ../scripts
          uv run ruff format --check --config ../ruff.toml ../scripts
          uv run ty check ../scripts

      # docs/*.html and docs/llms-full.txt are generated from the markdown under
      # mycelium-cli/src/mycelium/docs/, the @doc_ref decorators, and the pydantic
      # config schema. Same contract as the openapi.json check above: regenerate,
      # fail if the tree moves. Without it the committed output drifts silently and
      # the backlog lands as unrelated diff in whichever PR next runs the generator.
      - name: Docs site is current
        run: |
          (cd mycelium-cli && uv run python ../docs/generate_docs.py)
          if [ -n "$(git status --porcelain -- docs/)" ]; then
            echo "::error file=docs/llms-full.txt::Generated docs are stale — run 'cd mycelium-cli && uv run python ../docs/generate_docs.py' and commit docs/."
            git status --porcelain -- docs/
            git diff --stat -- docs/
            exit 1
          fi
          echo "Generated docs match their markdown + CLI sources."

  build-collector:
    # Smoke-build the OTLP collector image so PRs that touch the collector
    # source / Dockerfile fail fast in CI rather than at the next release.
    # Skipped on PRs that don't touch the collector — checked via the
    # paths-filter step rather than top-level workflow paths so the job
    # still runs on push to main (where path filters are less reliable
    # across rebases).
    name: Collector docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect collector-relevant changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            base="HEAD~1"
          else
            base="origin/${{ github.base_ref }}"
            git fetch --depth=1 origin "${{ github.base_ref }}"
          fi
          if git diff --name-only "$base"...HEAD | grep -E '^(mycelium-cli/Dockerfile\.collector|mycelium-cli/src/mycelium/(collector(_main)?\.py|docker/compose(-dev)?\.yml)|mycelium-cli/pyproject\.toml|\.github/workflows/(ci|release)\.yml)$' > /dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No collector-relevant files changed; skipping image build."
          fi

      - name: Set up Docker Buildx
        if: steps.changed.outputs.run == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build mycelium-collector image (no push)
        if: steps.changed.outputs.run == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: mycelium-cli
          file: mycelium-cli/Dockerfile.collector
          platforms: linux/amd64
          push: false
          load: true
          tags: mycelium-collector:ci
          cache-from: type=gha,scope=collector
          cache-to: type=gha,scope=collector,mode=max

      - name: Smoke-test collector entrypoint
        if: steps.changed.outputs.run == 'true'
        run: |
          # `--help` exits 0 if the image's Python deps and entrypoint resolve.
          docker run --rm --entrypoint python mycelium-collector:ci -m mycelium.collector_main --help

  build-backend:
    # The backend image is the one this stack cannot run without — it ships
    # `pi` (the aligner's brain), `slim-bindings` (the fabric), and the
    # embedding model — and it was the only image never built before release
    # day. The collector and the frontend both get smoke builds; this closes
    # the gap, path-filtered so it costs nothing on a PR that doesn't touch it.
    name: Backend docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect backend-relevant changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            base="HEAD~1"
          else
            base="origin/${{ github.base_ref }}"
            git fetch --depth=1 origin "${{ github.base_ref }}"
          fi
          if git diff --name-only "$base"...HEAD | grep -E '^(fastapi-backend/(Dockerfile|pyproject\.toml|uv\.lock|start\.sh)|\.github/workflows/(ci|release)\.yml)$' > /dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No backend image inputs changed; skipping image build."
          fi

      - name: Set up Docker Buildx
        if: steps.changed.outputs.run == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build mycelium-backend image (no push)
        if: steps.changed.outputs.run == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: fastapi-backend
          file: fastapi-backend/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: mycelium-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # Building proves the layers resolve. This proves the image can do the two
      # things the backend has no fallback for: the aligner's brain is Pi and
      # only Pi, and every room is a SLIM channel. An image missing either
      # starts cleanly and then fails at the first summon.
      #
      # `pi` is looked up the way pi_brain.py looks it up, rather than by
      # running it with a flag — the check should fail for the reason the
      # backend would, not because a CLI spells its version flag differently.
      - name: Smoke-test the runtime the backend has no fallback for
        if: steps.changed.outputs.run == 'true'
        run: |
          docker run --rm --entrypoint python3 mycelium-backend:ci -c '
          import shutil, sys
          import slim_bindings           # the fabric
          import app.main                # every route + service imports cleanly
          if shutil.which("pi") is None:
              sys.exit("pi is not on PATH: @aligner summons would fail in this image")
          print("slim-bindings, app.main and pi all resolve")
          '

  build-frontend:
    name: Frontend typecheck + lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mycelium-frontend/package-lock.json

      - name: Install dependencies
        working-directory: mycelium-frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: mycelium-frontend
        run: npx tsc --noEmit

      - name: Lint (eslint)
        working-directory: mycelium-frontend
        run: npx eslint .

      - name: Component tests (vitest)
        working-directory: mycelium-frontend
        run: npx vitest run

      - name: Build
        working-directory: mycelium-frontend
        run: npx next build

  build-frontend-image:
    name: Frontend docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect frontend-relevant changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            base="HEAD~1"
          else
            base="origin/${{ github.base_ref }}"
            git fetch --depth=1 origin "${{ github.base_ref }}"
          fi
          if git diff --name-only "$base"...HEAD | grep -E '^(mycelium-frontend/|\.github/workflows/(ci|release)\.yml$)' > /dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No frontend files changed; skipping image build."
          fi

      - name: Set up Docker Buildx
        if: steps.changed.outputs.run == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # The typecheck job above runs in the full checkout, where a file under
      # mycelium-frontend/ can reach sideways into a sibling directory and
      # resolve. The image build cannot: its context is mycelium-frontend/
      # alone, so an import that leaves it fails here and only here.
      - name: Build mycelium-frontend image (no push)
        if: steps.changed.outputs.run == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: mycelium-frontend
          file: mycelium-frontend/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: mycelium-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  docs-links:
    # Every internal link and anchor in docs/ and the repo's markdown. Anchors in
    # the generated site move as a side effect of rewording a heading, so this
    # reports rather than gates: a docs PR shouldn't go red over a jump target
    # its author never touched. The warnings land in the run summary, which is
    # the point — the breakage becomes visible in the run that caused it.
    # Stdlib Python, no toolchain, path-filtered to the trees it reads.
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect docs changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            base="HEAD~1"
          else
            base="origin/${{ github.base_ref }}"
            git fetch --depth=1 origin "${{ github.base_ref }}"
          fi
          if git diff --name-only "$base"...HEAD | grep -E '^(docs/|mycelium-cli/src/mycelium/docs/|[^/]+\.md$|\.github/workflows/ci\.yml$)' > /dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No docs changed; skipping link check."
          fi

      - name: Resolve internal links
        if: steps.changed.outputs.run == 'true'
        run: python3 scripts/check_docs_links.py

  integration-slim:
    # Debt D12: the guarded live-node slices are the real regression guard for the
    # SLIM coordination path, but they used to run only manually (skip-if-no-node),
    # so CI proved nothing about the live path. Stand up a slim node and execute
    # them per-PR — by file, since running a whole suite against a live node would
    # also re-run no-node unit tests that assume the fabric is down.
    name: Live-node integration slices (SLIM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitHub `services:` containers can't override the command or mount a config
      # file, so run the node with `docker run`. Config mirrors the compose one
      # (single standalone dataplane hub on :46357, TLS off for CI).
      - name: Start SLIM node
        run: |
          cat > "$RUNNER_TEMP/slim-config.yaml" <<'EOF'
          tracing:
            log_level: info
          runtime:
            n_cores: 0
            thread_name: "slim-data-plane"
            drain_timeout: 10s
          services:
            slim/0:
              node_id: mycelium-slim
              dataplane:
                servers:
                  - endpoint: "0.0.0.0:46357"
                    tls:
                      insecure: true
                clients: []
          EOF
          docker run -d --name mycelium-slim -p 46357:46357 \
            -v "$RUNNER_TEMP/slim-config.yaml:/slim-config.yaml" \
            ghcr.io/agntcy/slim:2.1.0 /slim --config /slim-config.yaml
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/46357) 2>/dev/null; then
              exec 3>&-
              echo "SLIM node is up on :46357"
              break
            fi
            sleep 1
          done

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Backend deps
        working-directory: fastapi-backend
        run: uv sync --group dev

      - name: Backend live-node slices
        working-directory: fastapi-backend
        env:
          MYCELIUM_SLIM_ENDPOINT: http://127.0.0.1:46357
          MYCELIUM_STUB_EMBEDDINGS: "1"
        run: >-
          uv run pytest -q
          tests/test_slim_roundtrip.py
          tests/test_l9_over_slim_roundtrip.py

      # The CLI has no live-node slices: `await`/`respond` are pure HTTP (the
      # SLIM member connector that needed a node was removed with the daemon).

      - name: SLIM node logs (on failure)
        if: failure()
        run: docker logs mycelium-slim || true

  timing:
    # Reports what the run cost, per job, against .github/ci-budgets.json. It
    # runs last because it reads the other jobs' durations back from the API,
    # and `always()` so a red run still gets its timing (a job that fails slowly
    # is the interesting case). It never fails: timing is information, not a
    # gate, and a warning that can block a merge stops being read.
    name: CI timing
    runs-on: ubuntu-latest
    # Not `always()`: a run cancelled by the concurrency group above has nothing
    # worth timing, and shouldn't spend a runner saying so.
    if: ${{ !cancelled() }}
    needs:
      - hygiene
      - docs-links
      - test-backend
      - test-cli
      - build-backend
      - build-collector
      - build-frontend
      - build-frontend-image
      - integration-slim
    permissions:
      contents: read
      actions: read   # list this run's jobs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report job durations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci_timing.py
