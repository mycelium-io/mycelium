name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      agensgraph:
        image: skaiworldwide/agensgraph:v2.16.0-alpine3.22
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mycelium
        options: >-
          --health-cmd "pg_isready -U postgres -d mycelium"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: fastapi-backend
        run: uv sync --group dev

      - name: Install pgvector in AgensGraph
        run: |
          docker exec ${{ job.services.agensgraph.id }} sh -c "
            apk add --no-cache build-base git &&
            git clone --branch v0.8.0 https://github.com/pgvector/pgvector.git /tmp/pgvector &&
            cd /tmp/pgvector && make OPTFLAGS='' && make install &&
            rm -rf /tmp/pgvector && apk del build-base git
          "
          docker exec ${{ job.services.agensgraph.id }} psql -U postgres -d mycelium -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Lint
        working-directory: fastapi-backend
        run: uv run ruff check .

      - name: Format check
        working-directory: fastapi-backend
        run: uv run ruff format --check .

      - name: Type check (ty)
        working-directory: fastapi-backend
        run: uv run ty check .

      - name: Unit tests (SQLite)
        working-directory: fastapi-backend
        env:
          MYCELIUM_STUB_EMBEDDINGS: "1"
        run: uv run pytest tests/ -x -q --ignore=tests/test_integration.py

      - name: Integration tests (AgensGraph + pgvector)
        working-directory: fastapi-backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/mycelium
          GRAPH_DB_URL: postgresql://postgres:password@localhost:5432/mycelium
          MYCELIUM_STUB_EMBEDDINGS: "1"
        run: uv run pytest tests/test_integration.py -x -q

  openapi-staleness:
    name: OpenAPI snapshot staleness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend deps
        working-directory: fastapi-backend
        run: uv sync --group dev

      - name: Boot backend (in-process)
        working-directory: fastapi-backend
        env:
          MYCELIUM_STUB_EMBEDDINGS: "1"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in {1..30}; do
            curl -sf http://127.0.0.1:8000/openapi.json >/dev/null && break
            sleep 1
          done

      - name: Diff live OpenAPI vs committed snapshot
        run: |
          curl -sf http://127.0.0.1:8000/openapi.json | python3 -m json.tool > /tmp/openapi.live.json
          if ! diff -u openapi.json /tmp/openapi.live.json; then
            echo "::error::Committed openapi.json is stale vs. live backend. Run scripts/snapshot-openapi.sh and commit, then regen clients with scripts/gen-mycelium-client.sh." >&2
            exit 1
          fi

  # CFN staleness check is run manually via scripts/gen-cfn-client.sh after
  # bumping ioc-cognition-fabric-node-svc in compose.yml. Adding it to CI
  # would require replicating the full compose stack (mgmt-plane + Postgres
  # for both `cfn_mgmt` and `cfn_cp` databases), which costs more than it
  # saves — CFN drift only happens when we explicitly bump the image, and
  # that's the natural moment to regen and commit.

  lint-cli:
    name: CLI lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: mycelium-cli
        run: uv sync --group dev

      - name: Lint
        working-directory: mycelium-cli
        run: uv run ruff check src/

      - name: Format check
        working-directory: mycelium-cli
        run: uv run ruff format --check src/

      - name: Type check (ty)
        working-directory: mycelium-cli
        run: uv run ty check .

  test-openclaw-plugin:
    name: OpenClaw plugin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install plugin dev dependencies
        working-directory: mycelium-cli/src/mycelium/integrations/openclaw/assets/mycelium/plugin
        run: npm install --no-audit --no-fund --silent

      - name: Run unit tests
        working-directory: mycelium-cli/src/mycelium/integrations/openclaw/assets/mycelium/plugin
        run: npm test

  build-collector:
    # Smoke-build the OTLP collector image so PRs that touch the collector
    # source / Dockerfile fail fast in CI rather than at the next release.
    # Skipped on PRs that don't touch the collector — checked via the
    # paths-filter step rather than top-level workflow paths so the job
    # still runs on push to main (where path filters are less reliable
    # across rebases).
    name: Collector docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2

      - name: Detect collector-relevant changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            base="HEAD~1"
          else
            base="origin/${{ github.base_ref }}"
            git fetch --depth=1 origin "${{ github.base_ref }}"
          fi
          if git diff --name-only "$base"...HEAD | grep -E '^(mycelium-cli/Dockerfile\.collector|mycelium-cli/src/mycelium/(collector(_main)?\.py|docker/compose(-dev)?\.yml)|mycelium-cli/pyproject\.toml|\.github/workflows/(ci|release)\.yml)$' > /dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No collector-relevant files changed; skipping image build."
          fi

      - name: Set up Docker Buildx
        if: steps.changed.outputs.run == 'true'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build mycelium-collector image (no push)
        if: steps.changed.outputs.run == 'true'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: mycelium-cli
          file: mycelium-cli/Dockerfile.collector
          platforms: linux/amd64
          push: false
          load: true
          tags: mycelium-collector:ci
          cache-from: type=gha,scope=collector
          cache-to: type=gha,scope=collector,mode=max

      - name: Smoke-test collector entrypoint
        if: steps.changed.outputs.run == 'true'
        run: |
          # `--help` exits 0 if the image's Python deps and entrypoint resolve.
          docker run --rm --entrypoint python mycelium-collector:ci -m mycelium.collector_main --help

  build-frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mycelium-frontend/package-lock.json

      - name: Install dependencies
        working-directory: mycelium-frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: mycelium-frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: mycelium-frontend
        run: npx next build
