name: Release CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create GitHub Releases and upload assets
  packages: write   # needed to push to GHCR

jobs:
  # Prerelease tags follow PEP 440: vX.Y.ZrcN, vX.Y.ZbN, vX.Y.ZaN, or
  # anything with "preview" in it. Prereleases skip every "promote to latest"
  # step (Docker :latest tag, GH "Latest" label, Homebrew bump).
  detect-release-type:
    name: Detect release type
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.detect.outputs.is_prerelease }}
    steps:
      - id: detect
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ (rc|alpha|beta|preview)[0-9]* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "→ $tag is a prerelease (skipping :latest promotion)"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "→ $tag is a stable release"
          fi

  publish-images:
    needs: detect-release-type
    name: Build and push Docker images to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: tags
        env:
          IS_PRERELEASE: ${{ needs.detect-release-type.outputs.is_prerelease }}
          VERSION: ${{ steps.version.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Stable releases get :latest + :version. Prereleases get :version only —
          # otherwise compose.yml's `pull_policy: always` would push the preview
          # to every existing user on their next `mycelium pull`.
          if [ "$IS_PRERELEASE" = "true" ]; then
            {
              echo "db<<EOF"
              echo "ghcr.io/$OWNER/mycelium-db:$VERSION"
              echo "EOF"
              echo "backend<<EOF"
              echo "ghcr.io/$OWNER/mycelium-backend:$VERSION"
              echo "EOF"
              echo "frontend<<EOF"
              echo "ghcr.io/$OWNER/mycelium-frontend:$VERSION"
              echo "EOF"
              echo "collector<<EOF"
              echo "ghcr.io/$OWNER/mycelium-collector:$VERSION"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "db<<EOF"
              echo "ghcr.io/$OWNER/mycelium-db:latest"
              echo "ghcr.io/$OWNER/mycelium-db:$VERSION"
              echo "EOF"
              echo "backend<<EOF"
              echo "ghcr.io/$OWNER/mycelium-backend:latest"
              echo "ghcr.io/$OWNER/mycelium-backend:$VERSION"
              echo "EOF"
              echo "frontend<<EOF"
              echo "ghcr.io/$OWNER/mycelium-frontend:latest"
              echo "ghcr.io/$OWNER/mycelium-frontend:$VERSION"
              echo "EOF"
              echo "collector<<EOF"
              echo "ghcr.io/$OWNER/mycelium-collector:latest"
              echo "ghcr.io/$OWNER/mycelium-collector:$VERSION"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push mycelium-db
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: fastapi-backend
          file: fastapi-backend/docker/Dockerfile.agensgraph
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.db }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/mycelium-db:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/mycelium-db:cache,mode=max

      - name: Bump backend pyproject version to match tag
        # FastAPI reads `version=` from this file at startup (see app/main.py
        # _read_pkg_version) so /health reports the right release. Without
        # this step the backend image ships with the placeholder version.
        working-directory: fastapi-backend
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^version = .*/version = \"$VERSION\"/" pyproject.toml && rm -f pyproject.toml.bak

      - name: Build and push mycelium-backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: fastapi-backend
          file: fastapi-backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.backend }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/mycelium-backend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/mycelium-backend:cache,mode=max

      - name: Build and push mycelium-frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: mycelium-frontend
          file: mycelium-frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # NEXT_PUBLIC_API_URL is baked at build time — keep the published
          # image pointing at the default local-install backend port. Users
          # with custom setups can rebuild the image with --build-arg API_URL=…
          build-args: |
            API_URL=http://localhost:8000
          tags: ${{ steps.tags.outputs.frontend }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/mycelium-frontend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/mycelium-frontend:cache,mode=max

      - name: Build and push mycelium-collector
        # Receives OTLP telemetry from agent diagnostics plugins. Build context
        # is the CLI dir because Dockerfile.collector
        # COPYs ./pyproject.toml and ./src/ from there.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: mycelium-cli
          file: mycelium-cli/Dockerfile.collector
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.collector }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/mycelium-collector:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/mycelium-collector:cache,mode=max

  build-binaries:
    needs: publish-images
    name: Build binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: darwin-arm64

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Bump version to match tag
        working-directory: mycelium-cli
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^version = .*/version = \"$VERSION\"/" pyproject.toml && rm -f pyproject.toml.bak

      - name: Build mycelium-client wheel
        working-directory: mycelium-client
        run: uv build --wheel

      - name: Install CLI + client + PyInstaller
        working-directory: mycelium-cli
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python \
            -e . \
            ../mycelium-client/dist/*.whl \
            pyinstaller

      - name: Build binary
        working-directory: mycelium-cli
        run: |
          .venv/bin/python -c "from mycelium.cli import app; app()" --help > /dev/null 2>&1 || true
          .venv/bin/pyinstaller \
            --onefile \
            --name mycelium \
            --collect-all mycelium \
            --collect-all pyfiglet \
            --hidden-import mycelium_backend_client \
            -p src \
            src/mycelium/cli.py
          mv dist/mycelium dist/mycelium-${{ matrix.platform }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mycelium-${{ matrix.platform }}
          path: mycelium-cli/dist/mycelium-${{ matrix.platform }}

  build-and-release:
    needs: [detect-release-type, publish-images, build-binaries]
    name: Build wheel and publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Bump version to match tag
        working-directory: mycelium-cli
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

      - name: Build wheel
        working-directory: mycelium-cli
        run: uv build --wheel

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mycelium-linux-x86_64
          path: mycelium-cli/dist/binaries

      - name: Download darwin binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mycelium-darwin-arm64
          path: mycelium-cli/dist/binaries

      - name: Generate checksums
        run: |
          cd mycelium-cli/dist
          sha256sum *.whl binaries/mycelium-* > binaries/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.ref_name }}
          name: mycelium ${{ github.ref_name }}
          # Marking the release as a prerelease keeps it out of the
          # /releases/latest redirect that install.sh and `mycelium upgrade`
          # both follow — testers opt in via `mycelium upgrade --version <tag>`.
          prerelease: ${{ needs.detect-release-type.outputs.is_prerelease == 'true' }}
          body: |
            ## Install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/mycelium-io/mycelium/main/install.sh | bash
            ```

            Or install a specific version:
            ```bash
            uv tool install mycelium-cli==${{ steps.version.outputs.version }}
            ```

            ## What's changed

            See [commits since last release](https://github.com/mycelium-io/mycelium/commits/${{ github.ref_name }}).
          files: |
            mycelium-cli/dist/*.whl
            mycelium-cli/dist/binaries/mycelium-*
            mycelium-cli/dist/binaries/checksums.txt
          fail_on_unmatched_files: true

  update-tap:
    needs: [detect-release-type, build-and-release]
    if: needs.detect-release-type.outputs.is_prerelease == 'false'
    name: Update homebrew tap
    runs-on: ubuntu-latest

    steps:
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download binaries and compute SHA256
        id: shas
        run: |
          curl -fsSL -o mycelium-darwin-arm64 \
            https://github.com/mycelium-io/mycelium/releases/download/${{ github.ref_name }}/mycelium-darwin-arm64
          curl -fsSL -o mycelium-linux-x86_64 \
            https://github.com/mycelium-io/mycelium/releases/download/${{ github.ref_name }}/mycelium-linux-x86_64
          echo "darwin=$(sha256sum mycelium-darwin-arm64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux=$(sha256sum mycelium-linux-x86_64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: mycelium-io/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DARWIN_SHA="${{ steps.shas.outputs.darwin }}"
          LINUX_SHA="${{ steps.shas.outputs.linux }}"
          FORMULA="homebrew-tap/Formula/mycelium.rb"

          sed -i "s/version \".*\"/version \"${VERSION}\"/" "$FORMULA"
          # darwin sha is the one after "on_arm do" block
          awk -v ver="$VERSION" -v dsha="$DARWIN_SHA" -v lsha="$LINUX_SHA" '
            /on_arm do/{arm=1}
            /on_intel do/{arm=0; intel=1}
            arm && /sha256/{sub(/sha256 ".*"/, "sha256 \""dsha"\""); arm=0}
            intel && /sha256/{sub(/sha256 ".*"/, "sha256 \""lsha"\""); intel=0}
            {print}
          ' "$FORMULA" > /tmp/mycelium.rb && mv /tmp/mycelium.rb "$FORMULA"

      - name: Commit and push
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mycelium.rb
          git diff --staged --quiet || git commit -m "chore: bump mycelium to v${{ steps.version.outputs.version }}"
          git push
