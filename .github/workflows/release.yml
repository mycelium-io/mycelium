name: Release CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create GitHub Releases and upload assets
  packages: write   # needed to push to GHCR

jobs:
  # Prerelease tags follow PEP 440: vX.Y.ZrcN, vX.Y.ZbN, vX.Y.ZaN, or
  # anything with "preview" in it. Prereleases skip every "promote to latest"
  # step (Docker :latest tag, GH "Latest" label, docs site, Homebrew bump), and
  # so does a stable tag a newer stable tag has already passed.
  detect-release-type:
    name: Detect release type
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.detect.outputs.is_prerelease }}
      version: ${{ steps.detect.outputs.version }}
      # Whether this run may take `latest`: a stable tag that is also the
      # highest stable version. Two releases run side by side (nothing queues
      # them), so the older one can finish last; deciding by version rather than
      # by finishing order keeps it from taking back :latest, the "Latest"
      # release, the docs site and the Homebrew formula.
      promote: ${{ steps.detect.outputs.promote }}
    steps:
      - id: detect
        env:
          REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [[ "$tag" =~ (rc|alpha|beta|preview)[0-9]* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "→ $tag is a prerelease (skipping :latest promotion)"
            exit 0
          fi
          echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          newest=$(git ls-remote --tags --refs "$REPO" 'v*' | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$tag" = "$newest" ]; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
            echo "→ $tag is a stable release, and the newest"
          else
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "→ $tag is a stable release, but $newest is newer: not promoting it to latest"
          fi

  publish-images:
    needs: detect-release-type
    name: Build and push Docker images to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: tags
        env:
          PROMOTE: ${{ needs.detect-release-type.outputs.promote }}
          VERSION: ${{ steps.version.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # The newest stable release gets :latest + :version. Anything else (a
          # prerelease, or a stable tag a newer one has passed) gets :version
          # only — otherwise compose.yml's `pull_policy: always` would hand it
          # to every existing user on their next `mycelium pull`.
          if [ "$PROMOTE" != "true" ]; then
            {
              echo "backend<<EOF"
              echo "ghcr.io/$OWNER/mycelium-backend:$VERSION"
              echo "EOF"
              echo "frontend<<EOF"
              echo "ghcr.io/$OWNER/mycelium-frontend:$VERSION"
              echo "EOF"
              echo "collector<<EOF"
              echo "ghcr.io/$OWNER/mycelium-collector:$VERSION"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "backend<<EOF"
              echo "ghcr.io/$OWNER/mycelium-backend:latest"
              echo "ghcr.io/$OWNER/mycelium-backend:$VERSION"
              echo "EOF"
              echo "frontend<<EOF"
              echo "ghcr.io/$OWNER/mycelium-frontend:latest"
              echo "ghcr.io/$OWNER/mycelium-frontend:$VERSION"
              echo "EOF"
              echo "collector<<EOF"
              echo "ghcr.io/$OWNER/mycelium-collector:latest"
              echo "ghcr.io/$OWNER/mycelium-collector:$VERSION"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Bump backend pyproject version to match tag
        # FastAPI reads `version=` from this file at startup (see app/main.py
        # _read_pkg_version) so /health reports the right release. Without
        # this step the backend image ships with the placeholder version.
        working-directory: fastapi-backend
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^version = .*/version = \"$VERSION\"/" pyproject.toml && rm -f pyproject.toml.bak

      - name: Build and push mycelium-backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: fastapi-backend
          file: fastapi-backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.backend }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/mycelium-backend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/mycelium-backend:cache,mode=max

      - name: Build and push mycelium-frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: mycelium-frontend
          file: mycelium-frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # NEXT_PUBLIC_API_URL is baked at build time — keep the published
          # image pointing at the default local-install backend port. Users
          # with custom setups can rebuild the image with --build-arg API_URL=…
          build-args: |
            API_URL=http://localhost:8000
          tags: ${{ steps.tags.outputs.frontend }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/mycelium-frontend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/mycelium-frontend:cache,mode=max

      - name: Build and push mycelium-collector
        # Receives OTLP telemetry from agent diagnostics plugins. Build context
        # is the CLI dir because Dockerfile.collector
        # COPYs ./pyproject.toml and ./src/ from there.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: mycelium-cli
          file: mycelium-cli/Dockerfile.collector
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.collector }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/mycelium-collector:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/mycelium-collector:cache,mode=max

  build-binaries:
    needs: publish-images
    name: Build binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: darwin-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Bump version to match tag
        working-directory: mycelium-cli
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^version = .*/version = \"$VERSION\"/" pyproject.toml && rm -f pyproject.toml.bak

      # The OpenAPI client isn't committed (#613); generate both copies from the
      # committed openapi.json before building the client wheel and the binary.
      - name: Generate OpenAPI client
        run: SPEC_FILE=openapi.json SKIP_FORMAT=1 bash scripts/gen-mycelium-client.sh

      - name: Build mycelium-client wheel
        working-directory: mycelium-client
        run: uv build --wheel

      - name: Install CLI + client + PyInstaller
        working-directory: mycelium-cli
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python \
            -e . \
            ../mycelium-client/dist/*.whl \
            pyinstaller

      - name: Build binary
        working-directory: mycelium-cli
        run: |
          .venv/bin/python -c "from mycelium.cli import app; app()" --help > /dev/null 2>&1 || true
          .venv/bin/pyinstaller \
            --onefile \
            --name mycelium \
            --collect-all mycelium \
            --collect-all pyfiglet \
            --hidden-import mycelium_backend_client \
            -p src \
            src/mycelium/cli.py
          mv dist/mycelium dist/mycelium-${{ matrix.platform }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mycelium-${{ matrix.platform }}
          path: mycelium-cli/dist/mycelium-${{ matrix.platform }}

  # The desktop app for Mac, Linux and Windows (desktop.yml), each attached
  # to the release under a fixed name so the docs' download links
  # (releases/latest/download/Mycelium-…) always resolve.
  build-desktop:
    needs: detect-release-type
    name: Build the desktop app
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ needs.detect-release-type.outputs.version }}
    secrets: inherit

  build-and-release:
    needs: [detect-release-type, publish-images, build-binaries, build-desktop]
    name: Build wheel and publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Bump version to match tag
        working-directory: mycelium-cli
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

      # The OpenAPI client isn't committed (#613); generate it into src/ so the
      # wheel includes it (setuptools packages.find picks it up).
      - name: Generate OpenAPI client
        run: SPEC_FILE=openapi.json SKIP_FORMAT=1 bash scripts/gen-mycelium-client.sh

      - name: Build wheel
        working-directory: mycelium-cli
        run: uv build --wheel

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mycelium-linux-x86_64
          path: mycelium-cli/dist/binaries

      - name: Download darwin binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mycelium-darwin-arm64
          path: mycelium-cli/dist/binaries

      # Every platform the desktop build made; Linux and Windows may be
      # missing while they are new (desktop.yml lets them fail).
      - name: Download the desktop app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mycelium-desktop-*
          merge-multiple: true
          path: mycelium-cli/dist/binaries

      # One latest.json for the app's updater, naming each platform built.
      - name: Merge the updater manifest
        working-directory: mycelium-cli/dist/binaries
        run: |
          ls updater-*.json
          jq -s '{version: .[0].version, pub_date: .[0].pub_date, platforms: (map(.platforms) | add)}' \
            updater-*.json > latest.json
          rm updater-*.json
          jq -r '.platforms | keys | join(", ")' latest.json

      - name: Generate checksums
        run: |
          cd mycelium-cli/dist
          sha256sum *.whl binaries/mycelium-* binaries/Mycelium-* > binaries/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: mycelium ${{ github.ref_name }}
          # Marking the release as a prerelease keeps it out of the
          # /releases/latest redirect that install.sh and `mycelium upgrade`
          # both follow — testers opt in via `mycelium upgrade --version <tag>`.
          prerelease: ${{ needs.detect-release-type.outputs.is_prerelease == 'true' }}
          # By version, not by date: left to its default, whichever release
          # was created last would take "Latest", an older one included.
          make_latest: ${{ needs.detect-release-type.outputs.promote == 'true' && 'true' || 'false' }}
          body: |
            ## Install

            **On a Mac:** download [Mycelium for Mac](https://github.com/mycelium-io/mycelium/releases/download/${{ github.ref_name }}/Mycelium-macos-arm64.dmg) (Apple silicon), drag it into Applications and open it. Already have it? It offers the update itself, or use Check for Updates… in its menu.

            **On Linux or Windows (preview):** download [the AppImage](https://github.com/mycelium-io/mycelium/releases/download/${{ github.ref_name }}/Mycelium-linux-x86_64.AppImage) (x86-64; `chmod +x` it and run it) or [the Windows installer](https://github.com/mycelium-io/mycelium/releases/download/${{ github.ref_name }}/Mycelium-windows-x86_64-setup.exe) (x64; not yet code-signed, so SmartScreen asks first: More info → Run anyway). The same app as on a Mac, updating itself the same way.

            **From a terminal:** on an Apple silicon Mac this installs the same app (no Docker) and links its `mycelium` CLI; on Linux or a server it installs the CLI, and `mycelium install` brings up the Docker stack (`--docker` picks that on a Mac too).

            ```bash
            curl -fsSL https://mycelium-io.github.io/mycelium/install.sh | bash
            ```

            Or install this version:
            ```bash
            curl -fsSL https://mycelium-io.github.io/mycelium/install.sh | bash -s -- --version ${{ steps.version.outputs.version }}
            ```

            ## What's changed

            See [commits since last release](https://github.com/mycelium-io/mycelium/commits/${{ github.ref_name }}).
          files: |
            mycelium-cli/dist/*.whl
            mycelium-cli/dist/binaries/mycelium-*
            mycelium-cli/dist/binaries/Mycelium-*
            mycelium-cli/dist/binaries/latest.json
            mycelium-cli/dist/binaries/checksums.txt
          fail_on_unmatched_files: true

  # The docs site moves with the newest stable release only, so it never
  # describes something a user can't install yet, or something older than
  # what they can.
  publish-docs:
    needs: [detect-release-type, build-and-release]
    if: needs.detect-release-type.outputs.promote == 'true'
    name: Publish the docs site
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ github.ref_name }}

  update-tap:
    needs: [detect-release-type, build-and-release]
    if: needs.detect-release-type.outputs.promote == 'true'
    name: Update homebrew tap
    runs-on: ubuntu-latest

    steps:
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download binaries and compute SHA256
        id: shas
        run: |
          curl -fsSL -o mycelium-darwin-arm64 \
            https://github.com/mycelium-io/mycelium/releases/download/${{ github.ref_name }}/mycelium-darwin-arm64
          curl -fsSL -o mycelium-linux-x86_64 \
            https://github.com/mycelium-io/mycelium/releases/download/${{ github.ref_name }}/mycelium-linux-x86_64
          echo "darwin=$(sha256sum mycelium-darwin-arm64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux=$(sha256sum mycelium-linux-x86_64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mycelium-io/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DARWIN_SHA="${{ steps.shas.outputs.darwin }}"
          LINUX_SHA="${{ steps.shas.outputs.linux }}"
          FORMULA="homebrew-tap/Formula/mycelium.rb"

          sed -i "s/version \".*\"/version \"${VERSION}\"/" "$FORMULA"
          # darwin sha is the one after "on_arm do" block
          awk -v ver="$VERSION" -v dsha="$DARWIN_SHA" -v lsha="$LINUX_SHA" '
            /on_arm do/{arm=1}
            /on_intel do/{arm=0; intel=1}
            arm && /sha256/{sub(/sha256 ".*"/, "sha256 \""dsha"\""); arm=0}
            intel && /sha256/{sub(/sha256 ".*"/, "sha256 \""lsha"\""); intel=0}
            {print}
          ' "$FORMULA" > /tmp/mycelium.rb && mv /tmp/mycelium.rb "$FORMULA"

      - name: Commit and push
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mycelium.rb
          git diff --staged --quiet || git commit -m "chore: bump mycelium to v${{ steps.version.outputs.version }}"
          git push
