# One way every workflow installs uv: a pinned version, tried twice.
#
# setup-uv fetches a version manifest before it downloads, even when the
# version is pinned: from Astral's mirror, then GitHub if that fails, each with
# a 5-second timeout. A slow answer (from GitHub, before setup-uv used the
# mirror) failed both of 3.0.74's binary builds, and a rerun passed. So the
# install runs once more when the first try fails. The version lives here, once;
# scripts/check_workflows.py keeps workflows from calling setup-uv directly.
name: Set up uv
description: Install the pinned uv, trying a second time if the first try fails.

inputs:
  enable-cache:
    description: Passed to setup-uv's enable-cache.
    required: false
    default: "auto"

runs:
  using: composite
  steps:
    - id: first
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      continue-on-error: true
      with:
        version: "0.13.6"
        enable-cache: ${{ inputs.enable-cache }}

    - if: steps.first.outcome == 'failure'
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.6"
        enable-cache: ${{ inputs.enable-cache }}
