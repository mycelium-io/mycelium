version: 2
updates:
  - package-ecosystem: pip
    directory: /fastapi-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # sherpa-onnx requires its core at the same version, so one PR moves both.
      sherpa-onnx:
        patterns: ["sherpa-onnx", "sherpa-onnx-core"]

  - package-ecosystem: pip
    directory: /mycelium-cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /mycelium-frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    # The workflows, and the repo's own actions (setup-uv's pin lives in one).
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
