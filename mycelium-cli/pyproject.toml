[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mycelium-cli"
version = "0.1.0"
description = "Command-line interface for the Mycelium coordination layer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Cisco ETI", email = "eti@cisco.com" }
]
keywords = ["mycelium", "cli", "coordination"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pydantic[email]>=2.13.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0.0",
    "toml>=0.10.2",
    "numpy>=2.4.4",
    "pyfiglet>=1.0.2",
    "beaupy>=3.5.0",
    "attrs>=22.2.0",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "opentelemetry-proto>=1.20.0,<2",
    "protobuf>=4.21.0",
    "rapidfuzz>=3.14.5",
    "questionary>=2.1.1",
    "slim-bindings>=2.1,<2.2",
    # ES256 keypair + JWK for the SignerJwt-floor SLIM identity (#476). A member
    # mints/holds its own signing key locally, mirroring the backend module.
    "cryptography>=42,<47",
]

[project.optional-dependencies]
# The `engine` extra pulls the cognition-engine runtime's heavy dep onto the
# host so a first-party engine (the SAO mediator) can run where the daemon runs
# — NEGMAS for the SAO mechanism. The mediator's brain is Pi, an external binary
# (not a Python dep). Opt-in (`pip install mycelium[engine]`) so the base CLI
# stays light; only hosts that run engines pay the cost. See
# docs/START_HERE_ENGINES.md (Stage B).
engine = [
    "negmas>=0.11",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.15.10",
    "mypy>=1.8.0",
    "types-toml>=0.10.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.15.10",
    "mypy>=1.8.0",
    "types-toml>=0.10.8",
    "ty>=0.0.33",
]

[project.scripts]
mycelium = "mycelium.cli:app"

[project.urls]
Homepage = "https://github.com/mycelium-io/mycelium"
Repository = "https://github.com/mycelium-io/mycelium"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mycelium = [
    "py.typed",
    "data/*.json",
    "docs/**/*.md",
    "integrations/claude_code/assets/**/*",
    "integrations/cursor/assets/**/*",
    "daemon/service/*",
    "docker/*",
    "docker/env.defaults",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
]

[tool.ty.src]
exclude = [
    "src/mycelium_backend_client",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = [
    "E501",
    "B008",
    "B904",
    "ARG001",
    "SIM102",
    "SIM105",
    "SIM108",
    "SIM115",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Integration contract methods: base/no-op implementations legitimately don't
# use every parameter the contract defines (e.g. ClaudeCodeIntegration.register
# ignores opts because the manifest IS the registration).
"src/mycelium/integrations/**/*.py" = ["ARG002"]
"tests/**/*.py" = ["ARG001", "ARG002", "ARG005"]
"src/mycelium_backend_client/**/*.py" = ["UP", "E", "W", "F", "B", "C4", "I", "ARG", "SIM"]
