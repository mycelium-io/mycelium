[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mycelium-cli"
version = "0.1.0"
description = "Command-line interface for Mycelium IoC/CFN coordination layer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Cisco ETI", email = "eti@cisco.com" }
]
keywords = ["mycelium", "cli", "cfn", "ioc", "coordination"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pydantic[email]>=2.13.0",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.0.0",
    "toml>=0.10.2",
    "numpy>=2.4.4",
    "pyfiglet>=1.0.2",
    "beaupy>=3.5.0",
    "attrs>=22.2.0",
    "python-dateutil>=2.8.0",
    "pyyaml>=6.0.3",
    "opentelemetry-proto>=1.20.0,<2",
    "protobuf>=4.21.0",
    "rapidfuzz>=3.10.0",
    "questionary>=2.1.1",
    "slim-bindings>=1.4,<2",
]

[project.optional-dependencies]
# The `engine` extra pulls the cognition-engine runtime's heavy deps onto the
# host so a first-party engine (the SAO mediator) can run where the daemon runs
# — NEGMAS for the SAO mechanism, litellm for the brain. Opt-in (`pip install
# mycelium[engine]`) so the base CLI stays light; only hosts that run engines
# pay the cost. See docs/START_HERE_ENGINES.md (Stage B).
engine = [
    "negmas>=0.11",
    "litellm>=1.55",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.15.10",
    "mypy>=1.8.0",
    "types-toml>=0.10.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.15.10",
    "mypy>=1.8.0",
    "types-toml>=0.10.8",
    "ty>=0.0.33",
]

[project.scripts]
mycelium = "mycelium.cli:app"

[project.urls]
Homepage = "https://github.com/mycelium-io/mycelium"
Repository = "https://github.com/mycelium-io/mycelium"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mycelium = [
    "py.typed",
    "data/*.json",
    "docs/**/*.md",
    "integrations/claude_code/assets/**/*",
    "integrations/cursor/assets/**/*",
    "integrations/openclaw/assets/mycelium/**/*",
    "integrations/hermes/assets/**/*",
    "daemon/service/*",
    "docker/*",
    "docker/initdb/*",
    "docker/env.defaults",
]

[tool.setuptools.exclude-package-data]
# Dev-only files inside the openclaw plugin source tree. node_modules ships
# test deps (vitest) that pyinstaller/setuptools would otherwise sweep into
# the wheel, bloating it by tens of MB. test/ is unit test source that has
# no runtime purpose on an end user's machine.
mycelium = [
    "integrations/openclaw/assets/mycelium/plugin/node_modules/**/*",
    "integrations/openclaw/assets/mycelium/plugin/test/**/*",
    "integrations/openclaw/assets/mycelium/plugin/package-lock.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
]

[tool.ty.src]
exclude = [
    "src/mycelium_backend_client",
    # Hermes-side plugin assets — staged into ~/.hermes/plugins/mycelium/
    # at install time and executed by the hermes gateway process, which has
    # ``aiohttp``, ``gateway.config``, and ``gateway.platforms.*`` available.
    # Those modules are not part of mycelium-cli's dependency closure, so we
    # exclude the asset tree from type checking here (analogous to how the
    # openclaw plugin assets are TypeScript and live outside Python's reach).
    "src/mycelium/integrations/hermes/assets",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = [
    "E501",
    "B008",
    "B904",
    "ARG001",
    "SIM102",
    "SIM105",
    "SIM108",
    "SIM115",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Integration contract methods: base/no-op implementations legitimately don't
# use every parameter the contract defines (e.g. ClaudeCodeIntegration.register
# ignores opts because the manifest IS the registration).
"src/mycelium/integrations/**/*.py" = ["ARG002"]
"tests/**/*.py" = ["ARG001", "ARG002", "ARG005"]
"src/mycelium_backend_client/**/*.py" = ["UP", "E", "W", "F", "B", "C4", "I", "ARG", "SIM"]
