# Inline SLIM node config (Compose `configs.content`, no external file to ship).
# Minimal single standalone hub: one dataplane server on :46357, TLS disabled
# for local dev (SPIRE/mTLS is a prod concern, out of scope for the MVP).
configs:
  slim-node-config:
    content: |
      tracing:
        log_level: info
      runtime:
        n_cores: 0
        thread_name: "slim-data-plane"
        drain_timeout: 10s
      services:
        slim/0:
          node_id: mycelium-slim
          dataplane:
            servers:
              - endpoint: "0.0.0.0:46357"
                tls:
                  insecure: true
            clients: []

services:

  # ── SLIM node (always started) ───────────────────────────────────────────────
  #
  # The secure messaging fabric — one stateless Rust binary that routes/fans out
  # messages by name. This is the only heavy thing in the target stack (no DB).
  # Rooms become SLIM group channels in Step 3; for now the node just runs and
  # nothing is wired to it. `mycelium hub host` brings up this service alone.

  slim:
    # Pinned to 2.1.x: the node's link-negotiation handshake must match the
    # `slim-bindings` wheel the backend/daemon use (`>=2.1,<2.2` in both
    # pyprojects). Mixing versions fails the handshake with "public key length
    # is invalid", so node + bindings move in lockstep. 2.1.x is the first
    # MLS-with-external-identity-capable stack (the SPIRE JWT-SVID -> MLS spike
    # in docs/design/spire-mls-spike proved it), the prereq for #476/#579.
    # Node 2.2.0 exists but has no matching PyPI bindings yet — stay on 2.1.x
    # until 2.2.x bindings publish, then bump both in lockstep and re-run the
    # spike run.sh.
    image: ghcr.io/agntcy/slim:${SLIM_IMAGE_TAG:-2.1.0}
    pull_policy: always
    container_name: mycelium-slim
    restart: unless-stopped
    command: ["/slim", "--config", "/slim-config.yaml"]
    configs:
      - source: slim-node-config
        target: /slim-config.yaml
    ports:
      - "${MYCELIUM_SLIM_PORT:-46357}:46357"

  # ── Mycelium Core (always started) ───────────────────────────────────────────
  #
  # The backend is a thin local process over markdown files + a local JSONL
  # search index — no database (SLIM-native rebuild). Room/memory state lives on
  # the host under MYCELIUM_DATA_DIR, bind-mounted below.

  mycelium-backend:
    image: ghcr.io/mycelium-io/mycelium-backend:${MYCELIUM_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: mycelium-backend
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      API_BASE_URL: http://mycelium-backend:8000
      # The SLIM node's in-network address. The backend is the room-channel
      # moderator (room_channels.py), so it must reach the node by its compose
      # service name — the default 127.0.0.1:46357 resolves to the backend
      # container itself, which silently no-ops every channel provision.
      SLIM_NODE_ENDPOINT: http://mycelium-slim:46357
      # IN-CONTAINER path the backend writes rooms/memory/plans to. MUST match
      # the bind-mount target below — otherwise writes land in the container's
      # overlay FS and are lost on recreate. (The host-side MYCELIUM_DATA_DIR
      # env var is read separately by docker compose to resolve the volume
      # source path; the two values are different by design.)
      MYCELIUM_DATA_DIR: /home/mycelium/.mycelium
    volumes:
      - ${MYCELIUM_DATA_DIR:-~/.mycelium}:/home/mycelium/.mycelium
    ports:
      - "${MYCELIUM_BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── Frontend (profile: ui) ───────────────────────────────────────────────
  #
  # Next.js frontend for browsing rooms, sessions, memory, and live negotiation.
  # Opt-in via `mycelium up --ui` (or `--profile ui` directly). The browser
  # only ever talks to its own origin (port MYCELIUM_UI_PORT) — the Next.js
  # server proxies /api/* to the backend internally over the compose network.

  mycelium-frontend:
    build:
      context: ../../../../mycelium-frontend
      dockerfile: Dockerfile
    image: ghcr.io/mycelium-io/mycelium-frontend:${MYCELIUM_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: mycelium-frontend
    restart: unless-stopped
    profiles: [ui]
    env_file:
      - path: ../.env
        required: false
    environment:
      MYCELIUM_INTERNAL_API_URL: http://mycelium-backend:8000
    depends_on:
      mycelium-backend:
        condition: service_healthy
    ports:
      - "${MYCELIUM_UI_PORT:-3000}:3000"

  # ── OTLP Collector (profile: metrics) ──────────────────────────────────────
  #
  # Lightweight HTTP receiver for OpenClaw diagnostics-otel and deep-
  # observability traces/metrics. Writes $DATA_DIR/metrics/metrics.json and
  # traces.db, and polls the backend for coordination metrics.
  # Opt-in via `mycelium up --metrics`.

  mycelium-collector:
    image: ghcr.io/mycelium-io/mycelium-collector:${MYCELIUM_IMAGE_TAG:-latest}
    container_name: mycelium-collector
    restart: unless-stopped
    profiles: [metrics]
    env_file:
      - path: ../.env
        required: false
    depends_on:
      mycelium-backend:
        condition: service_healthy
    ports:
      - "${MYCELIUM_METRICS_PORT:-4318}:4318"
    volumes:
      - ${MYCELIUM_DATA_DIR:-~/.mycelium}:/home/collector/.mycelium
    command:
      - "--port=4318"
      - "--output=/home/collector/.mycelium/metrics/metrics.json"
      - "--backend-url=http://mycelium-backend:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4318/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
