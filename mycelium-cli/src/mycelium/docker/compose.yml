services:

  # ── Mycelium Core (always started) ───────────────────────────────────────────
  #
  # Single AgensGraph instance: relational tables (SQL) + knowledge graph
  # (openCypher) + vector search (pgvector) — all in one database.

  mycelium-db:
    build:
      context: ../fastapi-backend
      dockerfile: docker/Dockerfile.agensgraph
    image: ghcr.io/mycelium-io/mycelium-db:${MYCELIUM_IMAGE_TAG:-latest}
    pull_policy: always
    platform: linux/amd64
    container_name: mycelium-db
    restart: unless-stopped
    command: postgres -c max_locks_per_transaction=256
    env_file:
      - path: ../.env
        required: false
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MYCELIUM_DB_PASSWORD:-password}
      POSTGRES_DB: mycelium
    ports:
      - "${MYCELIUM_DB_PORT:-5432}:5432"
    volumes:
      - mycelium-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mycelium"]
      interval: 5s
      timeout: 5s
      retries: 10

  mycelium-backend:
    image: ghcr.io/mycelium-io/mycelium-backend:${MYCELIUM_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: mycelium-backend
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    depends_on:
      mycelium-db:
        condition: service_healthy
    environment:
      # DATABASE_URL / GRAPH_DB_URL are materialised into ../.env by
      # `mycelium config apply` from a single recipe in
      # MyceliumConfig.database_url() — see the SSOT note in
      # mycelium-cli/src/mycelium/docker_utils.py. The nested fallbacks below
      # use ${MYCELIUM_DB_PASSWORD} so upgraded installs whose .env carries a
      # custom password (but no materialised DATABASE_URL yet) still
      # authenticate correctly; running `mycelium config apply` once
      # regenerates .env with the canonical URLs and the fallbacks become inert.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:${MYCELIUM_DB_PASSWORD:-password}@mycelium-db:5432/mycelium}
      GRAPH_DB_URL: ${GRAPH_DB_URL:-postgresql://postgres:${MYCELIUM_DB_PASSWORD:-password}@mycelium-db:5432/mycelium}
      API_BASE_URL: http://mycelium-backend:8000
      # IN-CONTAINER path the backend writes rooms/memory/plans to. MUST match
      # the bind-mount target below — otherwise writes land in the container's
      # overlay FS and are lost on recreate. (The host-side MYCELIUM_DATA_DIR
      # env var is read separately by docker compose to resolve the volume
      # source path; the two values are different by design.)
      MYCELIUM_DATA_DIR: /home/mycelium/.mycelium
    volumes:
      - ${MYCELIUM_DATA_DIR:-~/.mycelium}:/home/mycelium/.mycelium
    ports:
      - "${MYCELIUM_BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── Frontend (profile: ui) ───────────────────────────────────────────────
  #
  # Next.js frontend for browsing rooms, sessions, memory, and live negotiation.
  # Opt-in via `mycelium up --ui` (or `--profile ui` directly). The browser
  # only ever talks to its own origin (port MYCELIUM_UI_PORT) — the Next.js
  # server proxies /api/* to the backend internally over the compose network.

  mycelium-frontend:
    build:
      context: ../../../../mycelium-frontend
      dockerfile: Dockerfile
    image: ghcr.io/mycelium-io/mycelium-frontend:${MYCELIUM_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: mycelium-frontend
    restart: unless-stopped
    profiles: [ui]
    env_file:
      - path: ../.env
        required: false
    environment:
      MYCELIUM_INTERNAL_API_URL: http://mycelium-backend:8000
    depends_on:
      mycelium-backend:
        condition: service_healthy
    ports:
      - "${MYCELIUM_UI_PORT:-3000}:3000"

  # ── OTLP Collector (profile: metrics) ──────────────────────────────────────
  #
  # Lightweight HTTP receiver for OpenClaw diagnostics-otel and deep-
  # observability traces/metrics. Writes $DATA_DIR/metrics/metrics.json and
  # traces.db, and polls the backend for coordination metrics.
  # Opt-in via `mycelium up --metrics`.

  mycelium-collector:
    image: ghcr.io/mycelium-io/mycelium-collector:${MYCELIUM_IMAGE_TAG:-latest}
    container_name: mycelium-collector
    restart: unless-stopped
    profiles: [metrics]
    env_file:
      - path: ../.env
        required: false
    depends_on:
      mycelium-backend:
        condition: service_healthy
    ports:
      - "${MYCELIUM_METRICS_PORT:-4318}:4318"
    volumes:
      - ${MYCELIUM_DATA_DIR:-~/.mycelium}:/home/collector/.mycelium
    command:
      - "--port=4318"
      - "--output=/home/collector/.mycelium/metrics/metrics.json"
      - "--backend-url=http://mycelium-backend:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4318/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s


volumes:
  mycelium-db-data:
