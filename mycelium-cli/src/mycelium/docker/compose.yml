# Inline SLIM node config (Compose `configs.content`, no external file to ship).
# Minimal single standalone hub: one dataplane server on :46357, TLS disabled
# for local dev (the SLIM node is a blind ciphertext forwarder — attestation is
# app-level MLS identity, so the node itself never inspects identity even when the
# `spire` profile is on; see the `spire` block at the bottom of this file).
configs:
  slim-node-config:
    content: |
      tracing:
        log_level: info
      runtime:
        n_cores: 0
        thread_name: "slim-data-plane"
        drain_timeout: 10s
      services:
        slim/0:
          node_id: mycelium-slim
          dataplane:
            servers:
              - endpoint: "0.0.0.0:46357"
                tls:
                  insecure: true
            clients: []

  # ── SPIRE server config (only mounted by the `spire` profile) ────────────────
  # Dev-grade appliance SPIRE: SQLite datastore, join-token node attestation, short
  # JWT-SVID TTLs. The trust domain rides ${MYCELIUM_SLIM_SPIRE_TRUST_DOMAIN} so the
  # node, the backend's MLS identity, and `mycelium agent create` all agree on it.
  spire-server-config:
    content: |
      server {
        bind_address = "0.0.0.0"
        bind_port    = "8081"
        trust_domain = "${MYCELIUM_SLIM_SPIRE_TRUST_DOMAIN:-mycelium.dev}"
        data_dir     = "/opt/spire/data/server"
        log_level    = "INFO"
        jwt_issuer   = "${MYCELIUM_SLIM_SPIRE_TRUST_DOMAIN:-mycelium.dev}"
        ca_ttl       = "24h"
        default_jwt_svid_ttl = "5m"
      }
      plugins {
        DataStore "sql" {
          plugin_data {
            database_type = "sqlite3"
            connection_string = "/opt/spire/data/server/datastore.sqlite3"
          }
        }
        NodeAttestor "join_token" { plugin_data {} }
        KeyManager "disk" {
          plugin_data { keys_path = "/opt/spire/data/server/keys.json" }
        }
      }

  # ── SPIRE node-daemon config (only mounted by the `spire` profile) ───────────
  # "Node daemon" is SPIRE's per-node identity daemon (upstream image `spire-agent`)
  # — it has nothing to do with mycelium coordination agents (@alice); it serves the
  # Workload API socket and fetches SVIDs. The `unix` workload attestor identifies a
  # caller by its SO_PEERCRED PID, so the daemon shares the backend's PID namespace
  # (see `spire-node` below) and serves the Workload API over a NAMED VOLUME — a host
  # bind-mount drops peer creds on Docker Desktop (#584). Disk KeyManager + a
  # persisted data dir let it reuse its node SVID across restarts instead of
  # re-consuming the one-time join token.
  spire-node-config:
    content: |
      agent {
        data_dir       = "/opt/spire/data/agent"
        log_level      = "INFO"
        server_address = "mycelium-spire-server"
        server_port    = "8081"
        trust_domain   = "${MYCELIUM_SLIM_SPIRE_TRUST_DOMAIN:-mycelium.dev}"
        socket_path    = "/run/spire/sockets/agent.sock"
        insecure_bootstrap = true
      }
      plugins {
        NodeAttestor "join_token" { plugin_data {} }
        WorkloadAttestor "unix" { plugin_data {} }
        KeyManager "disk" {
          plugin_data { directory = "/opt/spire/data/agent" }
        }
      }

services:

  # ── SLIM node (always started) ───────────────────────────────────────────────
  #
  # The secure messaging fabric — one stateless Rust binary that routes/fans out
  # messages by name. This is the only heavy thing in the target stack (no DB).
  # Rooms become SLIM group channels in Step 3; for now the node just runs and
  # nothing is wired to it. `mycelium hub host` brings up this service alone.

  slim:
    # Pinned to 2.1.x: the node's link-negotiation handshake must match the
    # `slim-bindings` wheel the backend/daemon use (`>=2.1,<2.2` in both
    # pyprojects). Mixing versions fails the handshake with "public key length
    # is invalid", so node + bindings move in lockstep. 2.1.x is the first
    # MLS-with-external-identity-capable stack (the SPIRE JWT-SVID -> MLS spike
    # in docs/design/spire-mls-spike proved it), the prereq for #476/#579.
    # Node 2.2.0 exists but has no matching PyPI bindings yet — stay on 2.1.x
    # until 2.2.x bindings publish, then bump both in lockstep and re-run the
    # spike run.sh.
    image: ghcr.io/agntcy/slim:${SLIM_IMAGE_TAG:-2.1.0}
    pull_policy: always
    container_name: mycelium-slim
    restart: unless-stopped
    command: ["/slim", "--config", "/slim-config.yaml"]
    configs:
      - source: slim-node-config
        target: /slim-config.yaml
    ports:
      - "${MYCELIUM_SLIM_PORT:-46357}:46357"

  # ── Mycelium Core (always started) ───────────────────────────────────────────
  #
  # The backend is a thin local process over markdown files + a local JSONL
  # search index — no database (SLIM-native rebuild). Room/memory state lives on
  # the host under MYCELIUM_DATA_DIR, bind-mounted below.

  mycelium-backend:
    image: ghcr.io/mycelium-io/mycelium-backend:${MYCELIUM_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: mycelium-backend
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      API_BASE_URL: http://mycelium-backend:8000
      # The SLIM node's in-network address. The backend is the room-channel
      # moderator (room_channels.py), so it must reach the node by its compose
      # service name — the default 127.0.0.1:46357 resolves to the backend
      # container itself, which silently no-ops every channel provision.
      SLIM_NODE_ENDPOINT: http://mycelium-slim:46357
      # IN-CONTAINER path the backend writes rooms/memory/plans to. MUST match
      # the bind-mount target below — otherwise writes land in the container's
      # overlay FS and are lost on recreate. (The host-side MYCELIUM_DATA_DIR
      # env var is read separately by docker compose to resolve the volume
      # source path; the two values are different by design.)
      MYCELIUM_DATA_DIR: /home/mycelium/.mycelium
      # SPIRE Workload API socket + trust domain. Inert on the default `psk` path:
      # slim_identity only consults these when MYCELIUM_SLIM_IDENTITY=spire *and* the
      # socket exists on disk, and the socket only appears once the `spire` profile's
      # co-located node daemon is up (shares this container's PID namespace). Setting
      # them unconditionally keeps the backend service structurally identical across
      # profiles — the `spire` profile adds services, it never rewrites the backend.
      MYCELIUM_SLIM_SPIRE_SOCKET: unix:///run/spire/sockets/agent.sock
      MYCELIUM_SLIM_SPIRE_TRUST_DOMAIN: ${MYCELIUM_SLIM_SPIRE_TRUST_DOMAIN:-mycelium.dev}
    volumes:
      - ${MYCELIUM_DATA_DIR:-~/.mycelium}:/home/mycelium/.mycelium
      # Named volume for the SPIRE Workload API socket (empty on `psk`; the `spire`
      # agent populates it). Named, not a host bind — a bind drops peer creds (#584).
      - spire-socket:/run/spire/sockets
    ports:
      - "${MYCELIUM_BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── Frontend (profile: ui) ───────────────────────────────────────────────
  #
  # Next.js frontend for browsing rooms, sessions, memory, and live negotiation.
  # Opt-in via `mycelium up --ui` (or `--profile ui` directly). The browser
  # only ever talks to its own origin (port MYCELIUM_UI_PORT) — the Next.js
  # server proxies /api/* to the backend internally over the compose network.

  mycelium-frontend:
    build:
      context: ../../../../mycelium-frontend
      dockerfile: Dockerfile
    image: ghcr.io/mycelium-io/mycelium-frontend:${MYCELIUM_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: mycelium-frontend
    restart: unless-stopped
    profiles: [ui]
    env_file:
      - path: ../.env
        required: false
    environment:
      MYCELIUM_INTERNAL_API_URL: http://mycelium-backend:8000
    depends_on:
      mycelium-backend:
        condition: service_healthy
    ports:
      - "${MYCELIUM_UI_PORT:-3000}:3000"

  # ── OTLP Collector (profile: metrics) ──────────────────────────────────────
  #
  # Lightweight HTTP receiver for OpenClaw diagnostics-otel and deep-
  # observability traces/metrics. Writes $DATA_DIR/metrics/metrics.json and
  # traces.db, and polls the backend for coordination metrics.
  # Opt-in via `mycelium up --metrics`.

  mycelium-collector:
    image: ghcr.io/mycelium-io/mycelium-collector:${MYCELIUM_IMAGE_TAG:-latest}
    container_name: mycelium-collector
    restart: unless-stopped
    profiles: [metrics]
    env_file:
      - path: ../.env
        required: false
    depends_on:
      mycelium-backend:
        condition: service_healthy
    ports:
      - "${MYCELIUM_METRICS_PORT:-4318}:4318"
    volumes:
      - ${MYCELIUM_DATA_DIR:-~/.mycelium}:/home/collector/.mycelium
    command:
      - "--port=4318"
      - "--output=/home/collector/.mycelium/metrics/metrics.json"
      - "--backend-url=http://mycelium-backend:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4318/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── SPIRE server (profile: spire) ────────────────────────────────────────────
  #
  # Optional attested-identity tier (#588). Off the try-it path by design: the
  # `spire` profile is added automatically by `mycelium up` / `hub host` only when
  # `slim.identity=spire` — the user never passes `--profile spire` by hand. On the
  # default (`psk`) nothing here is created; the stack is byte-for-byte as before.
  #
  # SPIRE (server + node daemon + attestation) is the heaviest identity tier: it
  # mints per-member JWT-SVIDs the backend presents as MLS identity. `mycelium agent
  # create`/`rm` register/revoke the workload entries against this server itself
  # (via `docker compose exec`), so there is no hand-typed `spire-server entry
  # create`. See mycelium.spire_registry.
  #
  # The SPIRE images are DISTROLESS (no shell) with a fixed
  # ENTRYPOINT=[".../spire-server","run"], so the bring-up can't self-bootstrap via
  # an inline shell script. Instead `mycelium up` orchestrates it host-side (the
  # same seam spire_registry uses): start the server, wait healthy, mint a join
  # token bound to the fixed `agent-node` SPIFFE ID, then start the node daemon with
  # SPIRE_JOIN_TOKEN. `command:` only appends flags to the image entrypoint.
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.9.6
    pull_policy: always
    container_name: mycelium-spire-server
    hostname: mycelium-spire-server
    restart: unless-stopped
    profiles: [spire]
    configs:
      - source: spire-server-config
        target: /opt/spire/conf/server/server.conf
    volumes:
      - spire-server-data:/opt/spire/data/server
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ── SPIRE node daemon (profile: spire) ───────────────────────────────────────
  #
  # SPIRE's per-node identity daemon (upstream image `spire-agent`) — NOT a mycelium
  # coordination agent. Co-located with the backend: shares the backend's PID
  # namespace so the `unix` workload attestor can read the backend's SO_PEERCRED, and
  # serves the Workload API on the shared `spire-socket` named volume the backend
  # mounts. These are the two #584 gotchas baked in — cross-namespace or a host-bind
  # socket yields "could not resolve caller information" and a member stuck at
  # "Initializing spire identity manager."
  #
  # SPIRE_JOIN_TOKEN is injected by `mycelium up` after minting it against the live
  # server (distroless images can't hand the token off between two shell-less
  # containers). The disk KeyManager + persisted data dir let a restart reuse the
  # stored node SVID rather than re-consuming the spent one-time token.
  spire-node:
    image: ghcr.io/spiffe/spire-agent:1.9.6
    pull_policy: always
    container_name: mycelium-spire-noded
    restart: unless-stopped
    profiles: [spire]
    depends_on:
      spire-server:
        condition: service_healthy
    # Join the backend's PID namespace so the unix attestor can introspect it.
    pid: "service:mycelium-backend"
    configs:
      - source: spire-node-config
        target: /opt/spire/conf/agent/agent.conf
    volumes:
      - spire-node-data:/opt/spire/data/agent
      - spire-socket:/run/spire/sockets
    command:
      - "-config"
      - "/opt/spire/conf/agent/agent.conf"
      - "-joinToken"
      - "${SPIRE_JOIN_TOKEN:-}"

volumes:
  spire-server-data:
  spire-node-data:
  # The Workload API socket dir, shared backend ⇄ node daemon. Always declared
  # (compose requires it for the backend's mount); populated when the `spire` profile
  # brings the agent up.
  spire-socket:
