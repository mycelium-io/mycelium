services:

  # ── Mycelium Core (always started) ───────────────────────────────────────────
  #
  # Single AgensGraph instance: relational tables (SQL) + knowledge graph
  # (openCypher) + vector search (pgvector) — all in one database.
  # When the cfn profile is active, also hosts cfn_mgmt and cfn_cp databases.

  mycelium-db:
    build:
      context: ../fastapi-backend
      dockerfile: docker/Dockerfile.agensgraph
    image: ghcr.io/mycelium-io/mycelium-db:${MYCELIUM_IMAGE_TAG:-latest}
    pull_policy: always
    platform: linux/amd64
    container_name: mycelium-db
    restart: unless-stopped
    command: postgres -c max_locks_per_transaction=256
    env_file:
      - path: ../.env
        required: false
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MYCELIUM_DB_PASSWORD:-password}
      POSTGRES_DB: mycelium
    ports:
      - "${MYCELIUM_DB_PORT:-5432}:5432"
    volumes:
      - mycelium-db-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mycelium"]
      interval: 5s
      timeout: 5s
      retries: 10

  mycelium-backend:
    image: ghcr.io/mycelium-io/mycelium-backend:${MYCELIUM_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: mycelium-backend
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    depends_on:
      mycelium-db:
        condition: service_healthy
      # When cfn profile is active, wait for mgmt plane before registering
      ioc-cfn-mgmt-plane-svc:
        condition: service_healthy
        required: false
    environment:
      # DATABASE_URL / GRAPH_DB_URL are materialised into ../.env by
      # `mycelium config apply` from a single recipe in
      # MyceliumConfig.database_url() — see the SSOT note in
      # mycelium-cli/src/mycelium/docker_utils.py. The nested fallbacks below
      # use ${MYCELIUM_DB_PASSWORD} so upgraded installs whose .env carries a
      # custom password (but no materialised DATABASE_URL yet) still
      # authenticate correctly; running `mycelium config apply` once
      # regenerates .env with the canonical URLs and the fallbacks become inert.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:${MYCELIUM_DB_PASSWORD:-password}@mycelium-db:5432/mycelium}
      GRAPH_DB_URL: ${GRAPH_DB_URL:-postgresql://postgres:${MYCELIUM_DB_PASSWORD:-password}@mycelium-db:5432/mycelium}
      API_BASE_URL: http://mycelium-backend:8000
      COORDINATION_TICK_TIMEOUT_SECONDS: ${COORDINATION_TICK_TIMEOUT_SECONDS:-30}
      # Post L9 knowledge envelopes to the CFN's /api/l9/messages endpoint.
      # Requires a knowledge CE registered with the CFN — leave off otherwise.
      L9_CFN_ENABLED: ${L9_CFN_ENABLED:-false}
      # IN-CONTAINER path the backend writes rooms/memory/plans to. MUST match
      # the bind-mount target below — otherwise writes land in the container's
      # overlay FS and are lost on recreate. (The host-side MYCELIUM_DATA_DIR
      # env var is read separately by docker compose to resolve the volume
      # source path; the two values are different by design.)
      MYCELIUM_DATA_DIR: /home/mycelium/.mycelium
    volumes:
      - ${MYCELIUM_DATA_DIR:-~/.mycelium}:/home/mycelium/.mycelium
    ports:
      - "${MYCELIUM_BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── Frontend (profile: ui) ───────────────────────────────────────────────
  #
  # Next.js frontend for browsing rooms, sessions, memory, and live negotiation.
  # Opt-in via `mycelium up --ui` (or `--profile ui` directly). The browser
  # only ever talks to its own origin (port MYCELIUM_UI_PORT) — the Next.js
  # server proxies /api/* to the backend internally over the compose network.

  mycelium-frontend:
    build:
      context: ../../../../mycelium-frontend
      dockerfile: Dockerfile
    image: ghcr.io/mycelium-io/mycelium-frontend:${MYCELIUM_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: mycelium-frontend
    restart: unless-stopped
    profiles: [ui]
    env_file:
      - path: ../.env
        required: false
    environment:
      MYCELIUM_INTERNAL_API_URL: http://mycelium-backend:8000
    depends_on:
      mycelium-backend:
        condition: service_healthy
    ports:
      - "${MYCELIUM_UI_PORT:-3000}:3000"

  # ── OTLP Collector (profile: metrics) ──────────────────────────────────────
  #
  # Lightweight HTTP receiver for OpenClaw diagnostics-otel and deep-
  # observability traces/metrics. Writes $DATA_DIR/metrics/metrics.json and
  # traces.db, and polls the backend for coordination metrics.
  # Opt-in via `mycelium up --metrics`.

  mycelium-collector:
    image: ghcr.io/mycelium-io/mycelium-collector:${MYCELIUM_IMAGE_TAG:-latest}
    container_name: mycelium-collector
    restart: unless-stopped
    profiles: [metrics]
    env_file:
      - path: ../.env
        required: false
    depends_on:
      mycelium-backend:
        condition: service_healthy
    ports:
      - "${MYCELIUM_METRICS_PORT:-4318}:4318"
    volumes:
      - ${MYCELIUM_DATA_DIR:-~/.mycelium}:/home/collector/.mycelium
    command:
      - "--port=4318"
      - "--output=/home/collector/.mycelium/metrics/metrics.json"
      - "--backend-url=http://mycelium-backend:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4318/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Graph Viewer (optional, for development) ─────────────────────────────────

  mycelium-graph-viewer:
    image: skaiworldwide/agviewer:latest
    container_name: mycelium-graph-viewer
    restart: unless-stopped
    profiles: [dev]
    env_file:
      - path: ../.env
        required: false
    environment:
      DB_HOST: mycelium-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${MYCELIUM_DB_PASSWORD:-password}
      DB_NAME: mycelium
    ports:
      - "5457:3000"
    depends_on:
      - mycelium-db

  # ── CFN Stack (profile: cfn) ──────────────────────────────────────────────────

  ioc-cfn-mgmt-plane-svc:
    image: ghcr.io/outshift-open/ioc-cfn-mgmt-plane-svc:0.1.1
    container_name: ioc-cfn-mgmt-plane-svc
    restart: unless-stopped
    profiles: [cfn]
    env_file:
      - path: ../.env
        required: false
    depends_on:
      mycelium-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SERVICE_NAME: ioc-cfn-mgmt-plane-svc
      APPLICATION_VERSION: latest
      LOG_LEVEL: INFO
      ADMIN_USER_PASSWORD: ${ADMIN_USER_PASSWORD:-admin}
      POSTGRES_HOST: mycelium-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${CFN_DB:-cfn_mgmt}
      POSTGRES_USER: ${CFN_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${MYCELIUM_DB_PASSWORD:-password}
      PORT: 9000
      CFN_DEV_MODE: ${CFN_DEV_MODE:-false}
      # Must match the node-svc's CFN_NAME below — the mgmt plane's
      # Default-Workspace ↔ CFN auto-association branch (see #308) only
      # fires when the registering node's cfn_name equals this env var.
      # If unset, the mgmt plane silently falls back to "My Cognition
      # Fabric Node", the strings don't match, and workspace.cfn_id stays
      # NULL forever — breaking every CFN data-plane round trip.
      CFN_NAME: ${CFN_NAME:-mycelium-cfn}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s


  # The CFN service (ioc-cfn-svc, Go — semantic-alignment API + native L9
  # routing via POST /api/l9/messages). The service/DNS name is kept as
  # ioc-cognition-fabric-node-svc so existing installs' saved
  # COGNITION_FABRIC_NODE_URL values keep resolving across the 2.0.0 upgrade.
  ioc-cognition-fabric-node-svc:
    image: ghcr.io/outshift-open/ioc-cfn-svc:latest
    pull_policy: always
    container_name: ioc-cognition-fabric-node-svc
    restart: unless-stopped
    profiles: [cfn]
    env_file:
      - path: ../.env
        required: false
    depends_on:
      mycelium-db:
        condition: service_healthy
      ioc-cfn-mgmt-plane-svc:
        condition: service_healthy
    ports:
      - "9002:9002"
    environment:
      MGMT_URL: http://ioc-cfn-mgmt-plane-svc:9000
      CFN_NAME: ${CFN_NAME:-mycelium-cfn}
      DB_HOST: mycelium-db
      DB_PORT: 5432
      DB_NAME: cfn_cp
      DB_USER: ${CFN_DB_USER:-postgres}
      DB_PASSWORD: ${MYCELIUM_DB_PASSWORD:-password}
      DB_SSL_MODE: disable
      PORT: 9002
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-29}
    healthcheck:
      # The Go image is alpine + curl (no python3).
      test: ["CMD-SHELL", "curl -sf http://localhost:9002/api/internal/diagnostics/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s


volumes:
  mycelium-db-data:
