services:

  # ── Mycelium Core (always started) ───────────────────────────────────────────
  #
  # Single AgensGraph instance: relational tables (SQL) + knowledge graph
  # (openCypher) + vector search (pgvector) — all in one database.
  # When the cfn profile is active, also hosts cfn_mgmt and cfn_cp databases.

  mycelium-db:
    build:
      context: ../fastapi-backend
      dockerfile: docker/Dockerfile.agensgraph
    image: ghcr.io/mycelium-io/mycelium-db:${MYCELIUM_IMAGE_TAG:-latest}
    pull_policy: always
    platform: linux/amd64
    container_name: mycelium-db
    restart: unless-stopped
    # shared_preload_libraries=timescaledb — required by ioc-cfn-svc's cfn_cp
    # metrics tables. TimescaleDB is baked into the mycelium-db image
    # (Dockerfile.agensgraph); the published image must be rebuilt+republished
    # with it for the released cfn profile to start.
    command: postgres -c max_locks_per_transaction=256 -c shared_preload_libraries=timescaledb
    env_file:
      - path: ../.env
        required: false
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MYCELIUM_DB_PASSWORD:-password}
      POSTGRES_DB: mycelium
    ports:
      - "${MYCELIUM_DB_PORT:-5432}:5432"
    volumes:
      - mycelium-db-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mycelium"]
      interval: 5s
      timeout: 5s
      retries: 10

  mycelium-backend:
    image: ghcr.io/mycelium-io/mycelium-backend:${MYCELIUM_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: mycelium-backend
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    depends_on:
      mycelium-db:
        condition: service_healthy
      # When cfn profile is active, wait for mgmt plane before registering
      ioc-cfn-mgmt-plane-svc:
        condition: service_healthy
        required: false
    environment:
      # DATABASE_URL / GRAPH_DB_URL are materialised into ../.env by
      # `mycelium config apply` from a single recipe in
      # MyceliumConfig.database_url() — see the SSOT note in
      # mycelium-cli/src/mycelium/docker_utils.py. The nested fallbacks below
      # use ${MYCELIUM_DB_PASSWORD} so upgraded installs whose .env carries a
      # custom password (but no materialised DATABASE_URL yet) still
      # authenticate correctly; running `mycelium config apply` once
      # regenerates .env with the canonical URLs and the fallbacks become inert.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:${MYCELIUM_DB_PASSWORD:-password}@mycelium-db:5432/mycelium}
      GRAPH_DB_URL: ${GRAPH_DB_URL:-postgresql://postgres:${MYCELIUM_DB_PASSWORD:-password}@mycelium-db:5432/mycelium}
      API_BASE_URL: http://mycelium-backend:8000
      COORDINATION_TICK_TIMEOUT_SECONDS: ${COORDINATION_TICK_TIMEOUT_SECONDS:-30}
      # Post L9 knowledge envelopes to the CFN's /api/l9/messages endpoint.
      # Requires a knowledge CE registered with the CFN — leave off otherwise.
      L9_CFN_ENABLED: ${L9_CFN_ENABLED:-false}
      # IN-CONTAINER path the backend writes rooms/memory/plans to. MUST match
      # the bind-mount target below — otherwise writes land in the container's
      # overlay FS and are lost on recreate. (The host-side MYCELIUM_DATA_DIR
      # env var is read separately by docker compose to resolve the volume
      # source path; the two values are different by design.)
      MYCELIUM_DATA_DIR: /home/mycelium/.mycelium
    volumes:
      - ${MYCELIUM_DATA_DIR:-~/.mycelium}:/home/mycelium/.mycelium
    ports:
      - "${MYCELIUM_BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── Frontend (profile: ui) ───────────────────────────────────────────────
  #
  # Next.js frontend for browsing rooms, sessions, memory, and live negotiation.
  # Opt-in via `mycelium up --ui` (or `--profile ui` directly). The browser
  # only ever talks to its own origin (port MYCELIUM_UI_PORT) — the Next.js
  # server proxies /api/* to the backend internally over the compose network.

  mycelium-frontend:
    build:
      context: ../../../../mycelium-frontend
      dockerfile: Dockerfile
    image: ghcr.io/mycelium-io/mycelium-frontend:${MYCELIUM_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: mycelium-frontend
    restart: unless-stopped
    profiles: [ui]
    env_file:
      - path: ../.env
        required: false
    environment:
      MYCELIUM_INTERNAL_API_URL: http://mycelium-backend:8000
    depends_on:
      mycelium-backend:
        condition: service_healthy
    ports:
      - "${MYCELIUM_UI_PORT:-3000}:3000"

  # ── OTLP Collector (profile: metrics) ──────────────────────────────────────
  #
  # Lightweight HTTP receiver for OpenClaw diagnostics-otel and deep-
  # observability traces/metrics. Writes $DATA_DIR/metrics/metrics.json and
  # traces.db, and polls the backend for coordination metrics.
  # Opt-in via `mycelium up --metrics`.

  mycelium-collector:
    image: ghcr.io/mycelium-io/mycelium-collector:${MYCELIUM_IMAGE_TAG:-latest}
    container_name: mycelium-collector
    restart: unless-stopped
    profiles: [metrics]
    env_file:
      - path: ../.env
        required: false
    depends_on:
      mycelium-backend:
        condition: service_healthy
    ports:
      - "${MYCELIUM_METRICS_PORT:-4318}:4318"
    volumes:
      - ${MYCELIUM_DATA_DIR:-~/.mycelium}:/home/collector/.mycelium
    command:
      - "--port=4318"
      - "--output=/home/collector/.mycelium/metrics/metrics.json"
      - "--backend-url=http://mycelium-backend:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4318/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Graph Viewer (optional, for development) ─────────────────────────────────

  mycelium-graph-viewer:
    image: skaiworldwide/agviewer:latest
    container_name: mycelium-graph-viewer
    restart: unless-stopped
    profiles: [dev]
    env_file:
      - path: ../.env
        required: false
    environment:
      DB_HOST: mycelium-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${MYCELIUM_DB_PASSWORD:-password}
      DB_NAME: mycelium
    ports:
      - "5457:3000"
    depends_on:
      - mycelium-db

  # ── CFN Stack (profile: cfn) ──────────────────────────────────────────────────

  # The full CFN stack — four services, pinned to a coherent validated set
  # (the 2026-06-23-* builds sfph ran end-to-end against the live Go CFN).
  # Override any tag via the *_IMAGE_TAG env vars for the smoke test; bump the
  # defaults here as a set once a newer set is validated together.
  #
  # Default platform is linux/amd64 (the images are built amd64-first; they run
  # under emulation on arm64 Macs). Override with DOCKER_DEFAULT_PLATFORM.

  # Mgmt plane — workspaces, users, CFN-node registration, MAS config.
  ioc-cfn-mgmt-plane-svc:
    image: ghcr.io/outshift-open/ioc-cfn-mgmt-plane-svc:${CFN_MGMT_IMAGE_TAG:-2026-06-23-40056a5}
    container_name: ioc-cfn-mgmt-plane-svc
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    restart: unless-stopped
    profiles: [cfn]
    env_file:
      - path: ../.env
        required: false
    depends_on:
      mycelium-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SERVICE_NAME: ioc-cfn-mgmt-plane-svc
      APPLICATION_VERSION: dev
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ADMIN_USER_PASSWORD: ${ADMIN_USER_PASSWORD:-admin}
      POSTGRES_HOST: mycelium-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${CFN_DB:-cfn_mgmt}
      POSTGRES_USER: ${CFN_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${MYCELIUM_DB_PASSWORD:-password}
      PORT: 9000
      CFN_DEV_MODE: ${CFN_DEV_MODE:-false}
      # Newer mgmt plane locates the node via CFN_SVC_URL (the older
      # CFN_NAME-matching #308 mechanism is superseded).
      CFN_SVC_URL: ${CFN_SVC_URL:-http://ioc-cfn-svc:9002}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/internal/diagnostics/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  # Knowledge memory — graph (AgensGraph) + pgvector store the CFN writes to.
  ioc-knowledge-memory-svc:
    image: ghcr.io/outshift-open/ioc-knowledge-memory-svc:${CFN_KNOWLEDGE_IMAGE_TAG:-2026-06-23-ee8f699}
    container_name: ioc-knowledge-memory-svc
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    restart: unless-stopped
    profiles: [cfn]
    env_file:
      - path: ../.env
        required: false
    depends_on:
      mycelium-db:
        condition: service_healthy
      ioc-cfn-mgmt-plane-svc:
        condition: service_healthy
    ports:
      - "9003:9003"
    environment:
      SERVICE_NAME: ioc-knowledge-memory-svc
      APPLICATION_VERSION: dev
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MEMORY_PROVIDER_REGISTRATION_URL: http://ioc-cfn-mgmt-plane-svc:9000
      MEMORY_PROVIDER_ID: ${MEMORY_PROVIDER_ID:-de54dacb-60ab-476a-9e83-64e09f867358}
      # Uses the dedicated ioc-graph-db database (created by initdb).
      IOC_KNOWLEDGE_DB_HOST: mycelium-db
      IOC_KNOWLEDGE_DB: ${IOC_KNOWLEDGE_DB:-ioc-graph-db}
      IOC_KNOWLEDGE_DB_USER: ${CFN_DB_USER:-postgres}
      IOC_KNOWLEDGE_DB_PASSWORD: ${MYCELIUM_DB_PASSWORD:-password}
      IOC_KNOWLEDGE_DB_PORT: 5432
      EMBEDDING_VECTOR_SIZE: ${EMBEDDING_VECTOR_SIZE:-384}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9003/api/internal/diagnostics/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  # CFN node — the Go ioc-cfn-svc: semantic-alignment API + native L9 routing
  # (POST /api/l9/messages). HTTP on 9002, MCP on 9001 (mapped to host 9009).
  ioc-cfn-svc:
    image: ghcr.io/outshift-open/ioc-cfn-svc/ioc-cfn-svc:${CFN_SVC_IMAGE_TAG:-2026-06-23-41e11a6}
    container_name: ioc-cfn-svc
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    restart: unless-stopped
    profiles: [cfn]
    env_file:
      - path: ../.env
        required: false
    depends_on:
      mycelium-db:
        condition: service_healthy
      ioc-cfn-mgmt-plane-svc:
        condition: service_healthy
      ioc-knowledge-memory-svc:
        condition: service_healthy
    ports:
      - "9002:9002"
      - "9009:9001"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: ioc-cfn-svc
      MGMT_URL: http://ioc-cfn-mgmt-plane-svc:9000
      CFN_NAME: ${CFN_NAME:-mycelium-cfn}
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-10}
      DB_HOST: mycelium-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cfn_cp}
      DB_USER: ${CFN_DB_USER:-postgres}
      DB_PASSWORD: ${MYCELIUM_DB_PASSWORD:-password}
      KNOWLEDGE_MEMORY_SVC_URL: http://ioc-knowledge-memory-svc:9003
      COGNITION_ENGINE_SVC_URL: http://ioc-cfn-cognition-engine:9004
      MCP_PORT: 9001
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9002/api/internal/diagnostics/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  # Cognition engine — LLM + alignment scoring; auto-registers with the CFN
  # node on startup (CFN_URL) and heartbeats. Takes LLM config from the shared
  # ~/.mycelium/.env (LLM_MODEL/LLM_API_KEY/LLM_BASE_URL).
  ioc-cfn-cognition-engine:
    image: ghcr.io/outshift-open/ioc-cfn-cognition-engines:${CFN_CE_IMAGE_TAG:-2026-06-23-9e295b5}
    container_name: ioc-cfn-cognition-engine
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    restart: unless-stopped
    profiles: [cfn]
    env_file:
      - path: ../.env
        required: false
    ports:
      - "9004:9004"
    environment:
      ENABLE_DEDUP: "true"
      CFN_URL: http://ioc-cfn-svc:9002
      COGNITION_ENGINE_HOST: ioc-cfn-cognition-engine
      COGNITION_ENGINE_PORT: 9004
    depends_on:
      ioc-cfn-mgmt-plane-svc:
        condition: service_healthy
      ioc-cfn-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9004/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s


volumes:
  mycelium-db-data:
