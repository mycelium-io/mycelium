networks:
  mycelium:
    driver: bridge

services:

  # ── Mycelium Core (always started) ───────────────────────────────────────────
  #
  # The backend is a thin local process over markdown files + a local JSONL
  # search index, with no database. Room/memory state lives on the host under
  # MYCELIUM_DATA_DIR, bind-mounted below.

  mycelium-backend:
    image: ghcr.io/mycelium-io/mycelium-backend:${MYCELIUM_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: mycelium-backend
    restart: unless-stopped
    env_file:
      - path: ~/.mycelium/.env
        required: false
    environment:
      API_BASE_URL: http://mycelium-backend:8000
      # How this hub runs, for its usage events (the desktop app says "desktop").
      MYCELIUM_HUB_MODE: docker
      # IN-CONTAINER path the backend writes rooms/memory/plans to. MUST match
      # the bind-mount target below — otherwise writes land in the container's
      # overlay FS and are lost on recreate. (The host-side MYCELIUM_DATA_DIR
      # env var is read separately by docker compose to resolve the volume
      # source path; the two values are different by design.)
      MYCELIUM_DATA_DIR: /home/mycelium/.mycelium
      # The same folder as the host sees it (the mount's source below), which
      # /health reports so the app can tell this hub's store from its own.
      MYCELIUM_HOST_DATA_DIR: ${MYCELIUM_DATA_DIR:-~/.mycelium}
      # IN-CONTAINER path of the design-pattern pack (patterns.dir in config.toml,
      # a host path rendered to PATTERNS_DIR in .env and mounted below). Empty when
      # none is set, which is how the backend knows it has no pack.
      PATTERNS_DIR: ${PATTERNS_DIR:+/patterns}
    volumes:
      - ${MYCELIUM_DATA_DIR:-~/.mycelium}:/home/mycelium/.mycelium
      # Read-only, and only read when PATTERNS_DIR is set. With no pack it mounts
      # the data dir again, which nothing reads, rather than a path that may not exist.
      - ${PATTERNS_DIR:-${MYCELIUM_DATA_DIR:-~/.mycelium}}:/patterns:ro
    networks:
      - mycelium
    ports:
      - "${MYCELIUM_BIND_ADDR:-127.0.0.1}:${MYCELIUM_BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── Frontend (always started) ────────────────────────────────────────────
  #
  # Next.js frontend for browsing rooms, sessions, memory, and live negotiation.
  # Part of the stack, not an opt-in profile: `mycelium up` always brings it up
  # alongside the node and the backend. The browser only ever talks to its own
  # origin (port MYCELIUM_UI_PORT) — the Next.js server proxies /api/* to the
  # backend internally over the compose network.

  mycelium-frontend:
    build:
      context: ../../../../mycelium-frontend
      dockerfile: Dockerfile
    image: ghcr.io/mycelium-io/mycelium-frontend:${MYCELIUM_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: mycelium-frontend
    restart: unless-stopped
    env_file:
      - path: ~/.mycelium/.env
        required: false
    environment:
      MYCELIUM_INTERNAL_API_URL: http://mycelium-backend:8000
      # Browser OIDC login (#606) — off by default. Empty issuer/secret leaves the
      # frontend on the localStorage handle-picker tier, unchanged. Set these (and
      # turn the backend gate on) to require a real sign-in. MYCELIUM_OIDC_ISSUER is
      # the public issuer the browser reaches; MYCELIUM_OIDC_INTERNAL_ISSUER is the
      # in-network base the frontend server uses for discovery/token exchange (e.g.
      # http://keycloak:8080/realms/mycelium) — see keycloak/README.md.
      MYCELIUM_OIDC_ISSUER: ${MYCELIUM_OIDC_ISSUER:-}
      MYCELIUM_OIDC_INTERNAL_ISSUER: ${MYCELIUM_OIDC_INTERNAL_ISSUER:-}
      MYCELIUM_OIDC_CLIENT_ID: ${MYCELIUM_OIDC_CLIENT_ID:-mycelium-web}
      MYCELIUM_OIDC_AUDIENCE: ${MYCELIUM_OIDC_AUDIENCE:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      # Auth cookies default to Secure. Set to "false" for a plain-HTTP appliance
      # deployment with no TLS termination in front (e.g. a bare public IP) —
      # otherwise the browser silently drops them and login fails with "missing
      # code or state". Leave unset/true whenever TLS actually terminates.
      MYCELIUM_COOKIE_SECURE: ${MYCELIUM_COOKIE_SECURE:-}
      # The public name the app is reached by (ui.public_host), when it has one.
      # Loopback and IP addresses always work; any other name is refused.
      MYCELIUM_UI_HOST: ${MYCELIUM_UI_HOST:-}
    depends_on:
      mycelium-backend:
        condition: service_healthy
    networks:
      - mycelium
    ports:
      - "${MYCELIUM_BIND_ADDR:-127.0.0.1}:${MYCELIUM_UI_PORT:-8080}:3000"

  # ── OTLP Collector (profile: metrics) ──────────────────────────────────────
  #
  # Polls the backend's usage counters and any Prometheus scrape targets, and
  # receives OTLP traces. Writes $DATA_DIR/metrics/metrics.json and
  # traces.db. Opt-in via `mycelium up --metrics`.

  mycelium-collector:
    image: ghcr.io/mycelium-io/mycelium-collector:${MYCELIUM_IMAGE_TAG:-latest}
    container_name: mycelium-collector
    restart: unless-stopped
    profiles: [metrics]
    env_file:
      - path: ~/.mycelium/.env
        required: false
    depends_on:
      mycelium-backend:
        condition: service_healthy
    networks:
      - mycelium
    ports:
      - "${MYCELIUM_BIND_ADDR:-127.0.0.1}:${MYCELIUM_METRICS_PORT:-4318}:4318"
    volumes:
      - ${MYCELIUM_DATA_DIR:-~/.mycelium}:/home/collector/.mycelium
    command:
      - "--port=4318"
      - "--output=/home/collector/.mycelium/metrics/metrics.json"
      - "--backend-url=http://mycelium-backend:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4318/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Grafana LGTM (profile: grafana) ────────────────────────────────────────
  #
  # Full OpenTelemetry backend in a single image: OTel Collector + Prometheus
  # (metrics) + Tempo (traces) + Loki (logs/analytics events) + Grafana UI.
  # Opt-in via `mycelium up --grafana`. Can run alongside --metrics.
  #
  # Port mapping:
  #   MYCELIUM_GRAFANA_PORT (default 3001)           → Grafana UI  (admin / admin)
  #   MYCELIUM_GRAFANA_LOKI_PORT (default 3100)      → Loki push endpoint
  #   MYCELIUM_GRAFANA_OTLP_PORT (default 4319)      → OTLP HTTP  (avoids 4318 conflict with collector)
  #   MYCELIUM_GRAFANA_OTLP_GRPC_PORT (default 4320) → OTLP gRPC
  #
  # To route backend telemetry to Grafana instead of (or in addition to) the
  # collector, set TELEMETRY_OTLP_ENDPOINT=http://mycelium-grafana:4318 in
  # config.toml (the internal container port is always 4318).

  mycelium-grafana:
    image: grafana/otel-lgtm:latest
    container_name: mycelium-grafana
    restart: unless-stopped
    profiles: [grafana]
    depends_on:
      mycelium-backend:
        condition: service_healthy
    networks:
      - mycelium
    # Option C (local Grafana + forward to remote): set telemetry.forward_endpoint
    # in config.toml to make the internal OTel Collector fan telemetry out to a
    # remote OTLP backend (Grafana Cloud, Honeycomb, Datadog, Cisco, etc.), and
    # telemetry.otlp_headers for its auth (e.g. "x-honeycomb-team=<key>").
    # `config apply` renders them as OTEL_EXPORTER_OTLP_ENDPOINT/_HEADERS.
    env_file:
      - path: ~/.mycelium/.env
        required: false
    ports:
      - "${MYCELIUM_BIND_ADDR:-127.0.0.1}:${MYCELIUM_GRAFANA_PORT:-3001}:3000"
      - "${MYCELIUM_BIND_ADDR:-127.0.0.1}:${MYCELIUM_GRAFANA_LOKI_PORT:-3100}:3100"
      - "${MYCELIUM_BIND_ADDR:-127.0.0.1}:${MYCELIUM_GRAFANA_OTLP_PORT:-4319}:4318"
      - "${MYCELIUM_BIND_ADDR:-127.0.0.1}:${MYCELIUM_GRAFANA_OTLP_GRPC_PORT:-4320}:4317"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
