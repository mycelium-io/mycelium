# Transition override: build mycelium-db locally during ioc-golang cutover.
#
# compose.yml uses pull_policy: always on mycelium-db so end-user installs
# always get a fresh pull from ghcr.io. During the ioc-golang transition,
# the DB image requires a local build (TimescaleDB + pgvector baked in via
# Dockerfile.agensgraph). This overlay switches to a local build so devs
# working on this branch don't pull a stale registry image.
#
# Drop this file once the cutover to the IoC Go stack is complete and
# mycelium-db is no longer a custom-built image.
#
# Usage (from repo root):
#   docker compose \
#     -f mycelium-cli/src/mycelium/docker/compose.yml \
#     -f mycelium-cli/src/mycelium/docker/compose-transition.yml \
#     --profile cfn up -d --build
#
services:
  mycelium-db:
    build:
      context: ../../../../fastapi-backend
      dockerfile: docker/Dockerfile.agensgraph
    image: ghcr.io/mycelium-io/mycelium-db:dev
    pull_policy: never
