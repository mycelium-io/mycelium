[package]
name = "mycelium-desktop"
version = "0.1.0"
description = "Mycelium for macOS, Linux and Windows"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "mycelium_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools`: the web inspector in release builds too, opened from the menus
# (Developer Console), so a bug can be looked at while it's happening.
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
minisign-verify = "0.2"
base64 = "0.22"
futures-util = "0.3"
semver = "1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["time"] }
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"

[dev-dependencies]
minisign = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
